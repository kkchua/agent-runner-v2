# SDLC Execution v1 (BCS-compliant)
# Executes approved implementation plans, producing verified EXEC documents.
# Uses prompt slots for swappable strategies and impl presets for configuration.
#
# Pipeline:
#   1. Execute           — Pre-check state, implement per IMPL, run tests
#   2-3. Challenge <-> Address — adversarial attack, then evidence-based resolution
#   4-4b. Gatekeep <-> Refine — pass/fail gate, refinement on rejection
#   5. Promote           — deploy EXEC artifact (ACTION)
#   6. Complete          — terminal (ACTION)

[workflow]
name = "sdlc_60_execution_v1"
version = "2.0.0"
label = "SDLC Execution v1"
job_prefix = "SDLC60EXE"
description = "Execute approved implementation plan with adversarial challenge and pass/fail gate."
visibility = "canonical"
default_max_rejects = 2
init_step = "execute_task"
layer = "layer3"
platform = "agent-runner-v2"

# ============================================================================
# Implementations (BCS)
# ============================================================================

[[workflow.implementation]]
name = "standard"
description = "Default SDLC execution with adversarial challenge and pass/fail gate."
label = "Standard"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Execute Task (state-aware execution)
# ============================================================================

[[step]]
name = "execute_task"
prompt = "{{ slot.execute_task }}"
enable_notifications = true
onsuccess = "challenge_execution"

[step.artifacts]
required_inputs = ["IMPL_FILE"]
produces = ["EXEC_FILE"]
result_meta_key = "EXEC_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 2: Challenge Execution (adversarial)
# ============================================================================

[[step]]
name = "challenge_execution"
prompt = "{{ slot.challenge_execution }}"
enable_notifications = true
onsuccess = "address_challenges"

[step.artifacts]
required_inputs = ["EXEC_FILE", "IMPL_FILE"]
produces = ["CHALLENGE_FILE_SUGGESTED"]
result_meta_key = "CHALLENGE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "execute_task"
artifact = "EXEC_FILE"
max_iterations = 2
exhausted_failure_code = "EXEC_CHALLENGE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 2b: Address Challenges (evidence-based)
# ============================================================================

[[step]]
name = "address_challenges"
prompt = "{{ slot.address_challenges }}"
enable_notifications = true
onsuccess = "gatekeep_execution"

[step.artifacts]
required_inputs = ["EXEC_FILE", "CHALLENGE_FILE_SUGGESTED", "IMPL_FILE"]
produces = ["EXEC_FILE"]
target_artifact = "EXEC_FILE"
edit_mode = "in_place"
result_meta_key = "EXEC_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Gatekeep Execution (pass/fail gate)
# ============================================================================

[[step]]
name = "gatekeep_execution"
prompt = "{{ slot.gatekeep_execution }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_execution"

[step.artifacts]
required_inputs = ["EXEC_FILE", "CHALLENGE_FILE_SUGGESTED", "IMPL_FILE"]
produces = ["GATEKEEP_FILE_SUGGESTED"]
result_meta_key = "GATEKEEP_FILE_SUGGESTED"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "refine_execution"
artifact = "EXEC_FILE"
max_iterations = 2
exhausted_failure_code = "EXEC_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 3b: Refine Execution (conditional)
# ============================================================================

[[step]]
name = "refine_execution"
prompt = "{{ slot.refine_execution }}"
enable_notifications = true
onsuccess = "gatekeep_execution"

[step.artifacts]
required_inputs = ["EXEC_FILE", "GATEKEEP_FILE_SUGGESTED", "IMPL_FILE"]
produces = ["EXEC_FILE"]
target_artifact = "EXEC_FILE"
edit_mode = "in_place"
result_meta_key = "EXEC_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 4: Promote Execution (ACTION)
# ============================================================================

[[step]]
name = "promote_execution"
action = "promote_artifact"
promotes = "EXEC_FILE"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["EXEC_FILE"]
source = "EXEC_FILE"
dest = "EXEC_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/60_executions"
result_meta_key = "EXEC_FILE"

# ============================================================================
# Step 5: Step Completion (ACTION)
# ============================================================================

[[step]]
name = "stepCompletion"
action = "step_completion"
