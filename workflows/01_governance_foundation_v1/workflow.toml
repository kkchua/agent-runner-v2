# Governance Foundation v1 (BCS-compliant)
# Generates, validates, audits, and publishes the Layer 1 governance foundation set.
#
# Pipeline:
#   1. Collect     — gather governance context inventory (ACTION)
#   2. Generate    — produce 6 Layer 1 governance documents
#   3. Review      — internal quality review (loop → step 4, max 2)
#   4. Refine      — address review/validation/audit findings
#   5. Validate    — deterministic validation (ACTION)
#   6. Audit       — semantic audit with human approval gate [HUMAN GATE]
#   7. Publish     — deploy to current/ (ACTION)
#   8. Complete    — terminal (ACTION)

[workflow]
name = "01_governance_foundation_v1"
version = "2.0.0"
label = "Governance Foundation v1"
job_prefix = "01GF"
description = "Generates, validates, audits, and publishes the Layer 1 governance foundation set."
visibility = "canonical"
default_max_rejects = 3
init_step = "collect_governance_context"
layer = "layer1"
platform = "agent-runner-v2"

# ============================================================================
# Implementations (BCS)
# ============================================================================

[[workflow.implementation]]
name = "standard"
description = "Default Layer 1 governance generation with review, validation, and audit."
label = "Standard"

# ============================================================================
# Step 1: Collect Governance Context (ACTION)
# ============================================================================

[[step]]
name = "collect_governance_context"
action = "collect_governance_context"
enable_notifications = true
onsuccess = "generate_governance_foundation_docs"

[step.artifacts]
produces = ["GOVERNANCE_CONTEXT_INVENTORY"]
result_meta_key = "GOVERNANCE_CONTEXT_INVENTORY"

# ============================================================================
# Step 2: Generate Governance Foundation Docs
# ============================================================================

[[step]]
name = "generate_governance_foundation_docs"
prompt = "{{ slot.generate_governance_foundation_docs }}"
enable_notifications = true
onsuccess = "review_governance_foundation_docs"

[step.artifacts]
required_inputs = ["GOVERNANCE_CONTEXT_INVENTORY"]
produces = [
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
]
result_meta_key = "L1_FOUNDATION_INDEX"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Review Governance Foundation Docs
# ============================================================================

[[step]]
name = "review_governance_foundation_docs"
prompt = "{{ slot.review_governance_foundation_docs }}"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_governance_foundation_docs"

[step.artifacts]
required_inputs = [
  "GOVERNANCE_CONTEXT_INVENTORY",
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_governance_foundation_docs"
artifact = "L1_FOUNDATION_INDEX"
max_iterations = 2
exhausted_failure_code = "GOVERNANCE_FOUNDATION_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Governance Foundation Docs
# ============================================================================

[[step]]
name = "refine_governance_foundation_docs"
prompt = "{{ slot.refine_governance_foundation_docs }}"
enable_notifications = true
onsuccess = "review_governance_foundation_docs"

[step.artifacts]
required_inputs = [
  "GOVERNANCE_CONTEXT_INVENTORY",
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
  "REVIEW_FILE_SUGGESTED",
]
optional_inputs = ["GOVERNANCE_FOUNDATION_VALIDATION"]
produces = [
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
]
target_artifact = "L1_FOUNDATION_INDEX"
edit_mode = "in_place"
result_meta_key = "L1_FOUNDATION_INDEX"

[step.coder]
role_policy = "refine_standard"

# ============================================================================
# Step 5: Validate Governance Foundation Docs (ACTION)
# ============================================================================

[[step]]
name = "validate_governance_foundation_docs"
action = "validate_governance_foundation_docs"
enable_notifications = true
onsuccess = "audit_governance_foundation_docs"

[step.artifacts]
required_inputs = [
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
]
produces = ["GOVERNANCE_FOUNDATION_VALIDATION"]
result_meta_key = "GOVERNANCE_FOUNDATION_VALIDATION"

[step.on_reject_refine]
step = "refine_governance_foundation_docs"
artifact = "L1_FOUNDATION_INDEX"
max_iterations = 2
exhausted_failure_code = "GOVERNANCE_FOUNDATION_VALIDATION_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 6: Audit Governance Foundation Docs (Human Approval Gate)
# ============================================================================

[[step]]
name = "audit_governance_foundation_docs"
prompt = "{{ slot.audit_governance_foundation_docs }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "publish_governance_foundation_set"

[step.artifacts]
required_inputs = [
  "GOVERNANCE_CONTEXT_INVENTORY",
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
  "GOVERNANCE_FOUNDATION_VALIDATION",
]
produces = ["AUDIT_FILE_SUGGESTED"]
result_meta_key_from_context = "AUDIT_FILE_SUGGESTED"

[step.coder]
role_policy = "validation_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_governance_foundation_docs"
artifact = "L1_FOUNDATION_INDEX"
max_iterations = 2
exhausted_failure_code = "GOVERNANCE_FOUNDATION_AUDIT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 7: Publish Governance Foundation Set (ACTION)
# ============================================================================

[[step]]
name = "publish_governance_foundation_set"
action = "publish_governance_foundation_set"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = [
  "L1_FOUNDATION_INDEX",
  "L1_LAYER_MODEL",
  "L1_DOCUMENT_AUTHORITY",
  "L1_BUNDLE_TAXONOMY",
  "L1_GOVERNANCE_LIFECYCLE",
  "L1_METADATA_STANDARD",
  "GOVERNANCE_FOUNDATION_VALIDATION",
  "AUDIT_FILE_SUGGESTED",
]
produces = ["GOVERNANCE_PUBLISH_MANIFEST", "GOVERNANCE_PUBLISH_MANIFEST_HISTORY"]
result_meta_key = "GOVERNANCE_PUBLISH_MANIFEST"

# ============================================================================
# Step 8: Step Completion (ACTION)
# ============================================================================

[[step]]
name = "stepCompletion"
action = "step_completion"
