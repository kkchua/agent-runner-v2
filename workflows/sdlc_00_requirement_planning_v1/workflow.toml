enable_notifications = true
onsuccess = "backlog_review"

[step.artifacts]
required_inputs = ["BACKLOG_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["BACKLOG_FILE"]
target_artifact = "BACKLOG_FILE"
edit_mode = "in_place"
result_meta_key = "BACKLOG_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 4.3: Review Backlog (Human Gate)
# ============================================================================
[[step]]
name = "backlog_review"
prompt = "{{ slot.backlog_review }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_backlog"

[step.artifacts]
required_inputs = ["BACKLOG_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "backlog_refine"
artifact = "BACKLOG_FILE"
max_iterations = 2
exhausted_failure_code = "BACKLOG_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4.4: Refine Backlog (conditional)
# ============================================================================
[[step]]
name = "backlog_refine"
prompt = "{{ slot.backlog_refine }}"
enable_notifications = true
onsuccess = "backlog_review"

[step.artifacts]
required_inputs = ["BACKLOG_FILE", "REVIEW_FILE_SUGGESTED"]
produces = ["BACKLOG_FILE"]
target_artifact = "BACKLOG_FILE"
edit_mode = "in_place"
result_meta_key = "BACKLOG_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 4.5: Promote Backlog
