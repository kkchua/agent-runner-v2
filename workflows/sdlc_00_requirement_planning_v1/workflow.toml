[[step]]
name = "promote_plan"
action = "promote_artifact"
promotes = "PLAN_FILE"
enable_notifications = true
onsuccess = "backlog_generate"

[step.artifacts]
required_inputs = ["PLAN_FILE"]
source = "PLAN_FILE"
dest = "PLAN_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/20_plans"
