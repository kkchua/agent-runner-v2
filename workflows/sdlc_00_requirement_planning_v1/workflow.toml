[step.artifacts]
required_inputs = ["BACKLOG_FILE"]
source = "BACKLOG_FILE"
dest = "BACKLOG_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/30_backlogs"
result_meta_key = "BACKLOG_FILE"

# ============================================================================
# Phase 5: Task Generation
# ============================================================================

# ============================================================================
# Step 5.1: Generate Task
# ============================================================================
[[step]]
name = "task_generate"
prompt = "{{ slot.task_generate }}"
enable_notifications = true
onsuccess = "task_technical_critique"

[step.artifacts]
required_inputs = ["BACKLOG_FILE"]
optional_inputs = ["WORK_ITEM"]
produces = ["TASK_FILE"]
result_meta_key = "TASK_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5.2: Technical Critique
# ============================================================================
[[step]]
name = "task_technical_critique"
prompt = "{{ slot.task_technical_critique }}"
enable_notifications = true
onsuccess = "task_address_critique"

[step.artifacts]
required_inputs = ["TASK_FILE"]
produces = ["CRITIQUE_FILE_SUGGESTED"]
result_meta_key = "CRITIQUE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "task_generate"
artifact = "TASK_FILE"
max_iterations = 2
exhausted_failure_code = "TASK_CRITIQUE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 5.2b: Address Critique
# ============================================================================
[[step]]
name = "task_address_critique"
prompt = "{{ slot.task_address_critique }}"
enable_notifications = true
onsuccess = "task_review"

[step.artifacts]
required_inputs = ["TASK_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["TASK_FILE"]
target_artifact = "TASK_FILE"
edit_mode = "in_place"
result_meta_key = "TASK_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5.3: Review Task (Human Gate)
# ============================================================================
[[step]]
name = "task_review"
prompt = "{{ slot.task_review }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_task"

[step.artifacts]
required_inputs = ["TASK_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "task_refine"
artifact = "TASK_FILE"
max_iterations = 2
exhausted_failure_code = "TASK_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 5.4: Refine Task (conditional)
# ============================================================================
[[step]]
name = "task_refine"
prompt = "{{ slot.task_refine }}"
enable_notifications = true
onsuccess = "task_review"

[step.artifacts]
required_inputs = ["TASK_FILE", "REVIEW_FILE_SUGGESTED"]
produces = ["TASK_FILE"]
target_artifact = "TASK_FILE"
edit_mode = "in_place"
result_meta_key = "TASK_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5.5: Promote Task
# ============================================================================
