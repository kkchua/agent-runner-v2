result_meta_key = "BACKLOG_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 4.2: Technical Critique
# ============================================================================
[[step]]
name = "backlog_technical_critique"
prompt = "{{ slot.backlog_technical_critique }}"
enable_notifications = true
onsuccess = "backlog_address_critique"

[step.artifacts]
required_inputs = ["BACKLOG_FILE"]
produces = ["CRITIQUE_FILE_SUGGESTED"]
result_meta_key = "CRITIQUE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "backlog_generate"
artifact = "BACKLOG_FILE"
max_iterations = 2
exhausted_failure_code = "BACKLOG_CRITIQUE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
