[workflow]
name = "sdlc_40_task_v1"
version = "1.0.0"
label = "SDLC Task v1"
job_prefix = "SDLC40TSK"
description = "Generate task specification from approved backlog, producing approved TASK document."
visibility = "canonical"
default_max_rejects = 2
init_step = "generate_task"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Generate Task
# ============================================================================
[[step]]
name = "generate_task"
prompt = "prompts/01_generate_task.txt"
enable_notifications = true
onsuccess = "technical_critique"

[step.artifacts]
required_inputs = ["BACKLOG_FILE"]
optional_inputs = ["WORK_ITEM"]
produces = ["TASK_FILE"]
result_meta_key = "TASK_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 2: Technical Critique
# ============================================================================
[[step]]
name = "technical_critique"
prompt = "prompts/02_technical_critique.txt"
enable_notifications = true
onsuccess = "address_critique"

[step.artifacts]
required_inputs = ["TASK_FILE"]
produces = ["CRITIQUE_FILE_SUGGESTED"]
result_meta_key = "CRITIQUE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "generate_task"
artifact = "TASK_FILE"
max_iterations = 2
exhausted_failure_code = "TASK_CRITIQUE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 2b: Address Critique
# ============================================================================
[[step]]
name = "address_critique"
prompt = "prompts/02b_address_critique.txt"
enable_notifications = true
onsuccess = "review_task"

[step.artifacts]
required_inputs = ["TASK_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["TASK_FILE"]
target_artifact = "TASK_FILE"
edit_mode = "in_place"
result_meta_key = "TASK_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Review Task
# ============================================================================
[[step]]
name = "review_task"
prompt = "prompts/03_review_task.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_task"

[step.artifacts]
required_inputs = ["TASK_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_task"
artifact = "TASK_FILE"
max_iterations = 2
exhausted_failure_code = "TASK_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Task (conditional)
# ============================================================================
[[step]]
name = "refine_task"
prompt = "prompts/04_refine_task.txt"
enable_notifications = true

[step.artifacts]
required_inputs = ["TASK_FILE", "REVIEW_FILE_SUGGESTED"]
produces = ["TASK_FILE"]
target_artifact = "TASK_FILE"
edit_mode = "in_place"
result_meta_key = "TASK_FILE"

onsuccess = "review_task"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5: Promote Task
# ============================================================================
[[step]]
name = "promote_task"
action = "promote_artifact"
promotes = "TASK_FILE"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["TASK_FILE"]
source = "TASK_FILE"
dest = "TASK_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/40_tasks"
result_meta_key = "TASK_FILE"

# ============================================================================
# Step 6: Step Completion
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
