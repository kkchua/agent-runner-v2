[workflow]
name = "agnes_gen_video_v1"
version = "1.0.0"
label = "Agnes Video Generation v1"
job_prefix = "AGVID"
description = "Generate videos from images using pluggable video generation providers."
visibility = "canonical"
default_max_rejects = 3
init_step = "generate_videos"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

# ============================================================================
# Implementations
# ============================================================================
[[workflow.implementation]]
name = "agnes_v2"
description = "Generates videos using Agnes Video V2.0 API"
label = "Agnes V2.0"

[[workflow.implementation]]
name = "happyhorse_v1_1"
description = "Generates videos using HappyHorse-1.1-i2v API"
label = "HappyHorse v1.1"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Generate Videos (action-driven, Agnes Video V2.0 API)
# Scans step_03_generatedimage/ for PNG images, extracts prompts from metadata, generates videos
# ============================================================================
[[step]]
name = "generate_videos"
action = "generate_videos_default"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "archive_step_03"

[step.artifacts]
produces = ["VIDEO_INDEX"]
result_meta_key = "VIDEO_INDEX"

# ============================================================================
# Step 2: Archive step_03_generatedimage inputs (runs after generate_videos approval)
# ============================================================================
[[step]]
name = "archive_step_03"
action = "archive_inputs"
source_dir = "step_03_generatedimage"
archive_dir = "step_03_generatedimage_archive"
index_file = "step_04_generatedvideo/index.json"
onsuccess = "stepCompletion"

[step.artifacts]
result_meta_key = "ARCHIVE_STEP_03"

# ============================================================================
# Step 3: Step Completion (terminal)
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
