[workflow]
name = "sdlc_00_codebase_v1"
version = "2.0.0"
label = "SDLC Codebase v1"
job_prefix = "SDLC00CB"
description = "Codebase sync"
visibility = "canonical"
default_max_rejects = 2
init_step = "sync_codebase_docs"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Implementations (BCS)
# ============================================================================

[[workflow.implementation]]
name = "standard"
description = "codebase sync"
label = "Standard"

# ============================================================================
# Phase 1: Codebase Sync
# ============================================================================

# ============================================================================
# Step 1: Sync Codebase Docs (staging to runs/<job_id>/)
# ============================================================================
[[step]]
name = "sync_codebase_docs"
action = "sync_codebase_docs"
mode = "reconcile"
staging_root = "docs/repo/codebase/runs/{job_id}"
enable_notifications = true
onsuccess = "generate_sync_log"

[step.artifacts]
produces = ["CODEBASE_CHANGE_IMPACT", "CODEBASE_INVENTORY"]
result_meta_key = "CODEBASE_CHANGE_IMPACT"

# ============================================================================
# Step 2: Generate Sync Log
# ============================================================================
[[step]]
name = "generate_sync_log"
action = "generate_sync_log"
staging_root = "docs/repo/codebase/runs/{job_id}"
enable_notifications = true
onsuccess = "review_sync_log"

[step.artifacts]
produces = ["SYNC_LOG"]
result_meta_key = "SYNC_LOG"

# ============================================================================
# Step 3: Review Sync Log (human approval gate)
# ============================================================================
[[step]]
name = "review_sync_log"
prompt = "{{ slot.review_sync_log }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "validate_codebase_docs"

[step.artifacts]
required_inputs = ["SYNC_LOG", "CODEBASE_INVENTORY", "CODEBASE_CHANGE_IMPACT"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_codebase_docs"
artifact = "CODEBASE_INVENTORY"
max_iterations = 2
exhausted_failure_code = "CODEBASE_SYNC_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Codebase Docs (conditional)
# ============================================================================
[[step]]
name = "refine_codebase_docs"
prompt = "{{ slot.refine_codebase_docs }}"
enable_notifications = true
onsuccess = "review_sync_log"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY", "CODEBASE_CHANGE_IMPACT", "REVIEW_FILE_SUGGESTED"]
produces = ["CODEBASE_INVENTORY"]
target_artifact = "CODEBASE_INVENTORY"
edit_mode = "in_place"
result_meta_key = "CODEBASE_INVENTORY"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5: Validate Codebase Docs
# ============================================================================
[[step]]
name = "validate_codebase_docs"
action = "validate_codebase_docs"
mode = "reconcile"
staging_root = "docs/repo/codebase/runs/{job_id}"
enable_notifications = true
onsuccess = "create_backup"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY", "CODEBASE_CHANGE_IMPACT"]
produces = ["VALIDATION_FILE"]
result_meta_key = "VALIDATION_FILE"

[step.on_reject_refine]
step = "refine_codebase_docs"
artifact = "CODEBASE_INVENTORY"
max_iterations = 2
exhausted_failure_code = "CODEBASE_VALIDATION_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 6: Create Backup (before publish)
# ============================================================================
[[step]]
name = "create_backup"
action = "create_backup"
enable_notifications = true
onsuccess = "publish_codebase_docs"

[step.artifacts]
produces = ["CODEBASE_BACKUP"]
result_meta_key = "CODEBASE_BACKUP"

# ============================================================================
# Step 7: Publish Codebase Docs (copies runs/ to current/)
# ============================================================================
[[step]]
name = "publish_codebase_docs"
action = "publish_codebase_docs"
enable_notifications = false
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY", "CODEBASE_CHANGE_IMPACT"]
produces = ["CODEBASE_PUBLISH_MANIFEST", "CODEBASE_PUBLISH_MANIFEST_HISTORY"]
result_meta_key = "CODEBASE_PUBLISH_MANIFEST"

# ============================================================================
# Step 8: Step Completion
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
