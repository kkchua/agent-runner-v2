[governance]
canonical_source = "bundle_governance/core_governance.md"
generated_dir = "bundle_governance/generated"
adapter_targets = ["AGENTS.md", "QWEN.md", "CLAUDE.md"]
include_in_prompts = true
prompt_targets = ["generate_core_governance_docs", "review_core_governance_docs", "refine_core_governance_docs", "audit_core_governance_accuracy"]

[[extension]]
name = "Artifact Registry Rules"
source = "bundle_governance/extensions/artifact_registry_rules.md"
targets = ["all", "prompt"]
enabled = true
required = true
description = "Defines the owned artifact set and boundary rules for the core governance bundle."

[[extension]]
name = "Review and Recovery Rules"
source = "bundle_governance/extensions/review_recovery_rules.md"
targets = ["AGENTS.md", "QWEN.md", "CLAUDE.md", "prompt"]
enabled = true
required = true
description = "Defines rejection handling, audit expectations, and deterministic recovery behavior."

[[artifact]]
key = "SYSTEM_DOCS_INDEX"
path = "docs/system/00_governance/bootstrap/README.md"
description = "Canonical ecosystem documentation index."
required = true

[[artifact]]
key = "SYSTEM_DOC_STANDARD"
path = "docs/system/00_governance/bootstrap/DOCUMENTATION_STANDARD.md"
description = "Canonical documentation contract for ecosystem governance."
required = true

[[artifact]]
key = "BUNDLE_TAXONOMY"
path = "docs/system/00_governance/bootstrap/BUNDLE_TAXONOMY.md"
description = "Canonical bundle taxonomy and ownership rules."
required = true

[[artifact]]
key = "BUNDLE_MIGRATION_PLAN"
path = "docs/system/00_governance/bootstrap/BUNDLE_MIGRATION_PLAN.md"
description = "Canonical migration plan for moving to the three-layer model."
required = true

[[artifact]]
key = "SYSTEM_DOCS_VALIDATION"
path = "docs/system/00_governance/bootstrap/<job_id>-core-governance-validation.md"
description = "Deterministic validation report for core governance checks."
required = false

[[artifact]]
key = "REVIEW_FILE_SUGGESTED"
path = "docs/system/00_governance/bootstrap/<job_id>-core-governance-review.md"
description = "Deterministic reviewer or audit output used for refinement loops."
required = false
