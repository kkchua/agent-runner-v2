[workflow]
name = "agnes_media_gen_v1"
version = "1.0.0"
label = "Agnes Media Generation v1"
job_prefix = "AMGEN"
description = "End-to-end media generation pipeline: extract image descriptions via LLM vision, generate prompt variants, call Agnes Image 2.1 Flash API for images, call Agnes Video V2.0 API for image-to-video animations."
visibility = "canonical"
default_max_rejects = 3
init_step = "extract_descriptions"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Extract Descriptions (prompt-driven, LLM vision)
# ============================================================================
[[step]]
name = "extract_descriptions"
prompt = "prompts/01_extract_descriptions.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_prompts"

[step.artifacts]
produces = ["IMAGE_DESCRIPTIONS"]
result_meta_key = "IMAGE_DESCRIPTIONS"

[step.coder]
role_policy = "architect_standard"

[step.on_reject_refine]
step = "extract_descriptions"
artifact = "IMAGE_DESCRIPTIONS"
max_iterations = 1
exhausted_failure_code = "DESCRIPTION_EXTRACT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 2: Generate Prompts (prompt-driven, LLM text generation)
# ============================================================================
[[step]]
name = "generate_prompts"
prompt = "prompts/02_generate_prompts_v4.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_images"

[step.artifacts]
produces = ["PROMPT_VARIANTS"]
result_meta_key = "PROMPT_VARIANTS"

[step.coder]
role_policy = "architect_standard"

[step.on_reject_refine]
step = "generate_prompts"
artifact = "PROMPT_VARIANTS"
max_iterations = 1
exhausted_failure_code = "PROMPT_GENERATION_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 3: Generate Images (action-driven, Agnes Image 2.1 Flash API)
# No on_reject_refine — action failures need human investigation, not auto-retry.
# Archiving deferred to archive_step_02 (runs after approval).
# ============================================================================
[[step]]
name = "generate_images"
action = "generate_images"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "archive_step_02"

[step.artifacts]
produces = ["IMAGE_INDEX"]
result_meta_key = "IMAGE_INDEX"

# ============================================================================
# Step 3b: Archive step_02 inputs (runs after generate_images approval)
# Only archives files listed in step_03/index.json (processed by current job).
# Deletes index.json files instead of archiving them.
# ============================================================================
[[step]]
name = "archive_step_02"
action = "archive_inputs"
source_dir = "step_02"
archive_dir = "step_02_archive"
index_file = "step_03/index.json"
onsuccess = "generate_videos"

[step.artifacts]
result_meta_key = "ARCHIVE_STEP_02"

# ============================================================================
# Step 4: Generate Videos (action-driven, Agnes Video V2.0 API)
# No on_reject_refine — action failures need human investigation, not auto-retry.
# Archiving deferred to archive_step_03 (runs after approval).
# ============================================================================
[[step]]
name = "generate_videos"
action = "generate_videos"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "archive_step_03"

[step.artifacts]
produces = ["VIDEO_INDEX"]
result_meta_key = "VIDEO_INDEX"

# ============================================================================
# Step 4b: Archive step_03 inputs (runs after generate_videos approval)
# Only archives files listed in step_04/index.json (processed by current job).
# Deletes index.json files instead of archiving them.
# ============================================================================
[[step]]
name = "archive_step_03"
action = "archive_inputs"
source_dir = "step_03"
archive_dir = "step_03_archive"
index_file = "step_04/index.json"
onsuccess = "stepCompletion"

[step.artifacts]
result_meta_key = "ARCHIVE_STEP_03"

# ============================================================================
# Step 5: Step Completion (terminal)
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
