# Text Summarizer
# Transforms long text documents into a condensed summary and extracted
# key points list following the Input Transformation pattern.
#
# Pipeline: Load -> Parse -> Validate L1 -> Extract Key Points ->
#           Remove Redundancy -> Preserve Meaning -> Maintain Structure ->
#           Validate Output -> Render Output

[workflow]
name = "text_summarizer_ayz"
version = "1.0.0"
label = "Text Summarizer"
job_prefix = "TSUM"
description = "Transforms long text documents (.txt or .md) into a condensed prose summary (max 20% of original word count) and an ordered key points list with importance scores."
visibility = "canonical"
default_max_rejects = 3
init_step = "load_input"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# =============================================================================
# Phase 1: Input Processing (Steps 1-3)
# =============================================================================

[[step]]
name = "load_input"
action = "load_input_file"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "parse_document"

[step.artifacts]
required_inputs = ["SOURCE_TEXT_FILE"]
produces = ["PARSED_DOCUMENT"]
result_meta_key = "LOAD_RESULT"

[[step]]
name = "parse_document"
action = "parse_document"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_layer_1"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT"]
produces = ["PARSED_DOCUMENT"]
result_meta_key = "PARSE_RESULT"

[[step]]
name = "validate_layer_1"
action = "validate_layer1"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "extract_key_points"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT"]
produces = ["VALIDATION_REPORT"]
result_meta_key = "VAL_L1_RESULT"

# =============================================================================
# Phase 2: Transformation (Steps 4-7)
# =============================================================================

[[step]]
name = "extract_key_points"
prompt = "prompts/extract_keypoints.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "remove_redundancy"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT"]
produces = ["KEY_POINTS_DATA"]
result_meta_key = "KEY_POINTS_DATA"

[step.on_reject_refine]
step = "extract_key_points"
artifact = "KEY_POINTS_DATA"
max_iterations = 2
exhausted_failure_code = "EXT_KEYPOINTS_RETRY_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "remove_redundancy"
prompt = "prompts/remove_redundancy.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "preserve_meaning"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT", "KEY_POINTS_DATA"]
produces = ["REDUNDANCY_CLUSTERS"]
result_meta_key = "REDUNDANCY_CLUSTERS"

[step.on_reject_refine]
step = "remove_redundancy"
artifact = "REDUNDANCY_CLUSTERS"
max_iterations = 2
exhausted_failure_code = "REDUNDANCY_RETRY_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "preserve_meaning"
prompt = "prompts/preserve_meaning.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "maintain_structure"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["KEY_POINTS_DATA", "REDUNDANCY_CLUSTERS", "PARSED_DOCUMENT"]
produces = ["CONTENT_BLOCKS"]
result_meta_key = "CONTENT_BLOCKS"

[step.on_reject_refine]
step = "preserve_meaning"
artifact = "CONTENT_BLOCKS"
max_iterations = 2
exhausted_failure_code = "MEANING_RETRY_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "maintain_structure"
action = "maintain_structure"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_output"

[step.artifacts]
required_inputs = ["CONTENT_BLOCKS", "PARSED_DOCUMENT"]
produces = ["CONTENT_BLOCKS"]
result_meta_key = "STRUCTURE_RESULT"

# =============================================================================
# Phase 3: Validation and Output (Steps 8-9)
# =============================================================================

[[step]]
name = "validate_output"
action = "validate_output"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "render_output"

[step.artifacts]
required_inputs = ["CONTENT_BLOCKS", "PARSED_DOCUMENT", "KEY_POINTS_DATA"]
produces = ["OUTPUT_ASSEMBLY", "VALIDATION_REPORT"]
result_meta_key = "VAL_OUT_RESULT"

[[step]]
name = "render_output"
action = "render_output"
enable_notifications = true
requires_human_approval_after = false

[step.artifacts]
required_inputs = ["OUTPUT_ASSEMBLY", "CONTENT_BLOCKS", "KEY_POINTS_DATA"]
produces = ["CONDENSED_SUMMARY", "KEY_POINTS_LIST"]
result_meta_key = "RENDER_RESULT"
