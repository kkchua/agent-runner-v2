[workflow]
name = "text_summarizer"
version = "1.0.0"
label = "Text Summarizer"
job_prefix = "TXSUM"
description = "Transforms an input text file into a condensed summary via a 10-stage pipeline. Enforces structural constraints (20% max compression, same language, no new information) through deterministic validation and recovery loops."
visibility = "canonical"
default_max_rejects = 3
init_step = "validate_input"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# =============================================================================
# Phase 1: Input Preparation
# =============================================================================

[[step]]
name = "validate_input"
action = "validate_input"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "prepare_configuration"

[step.artifacts]
required_inputs = ["INPUT_TEXT_FILE"]
produces = []
result_meta_key = "INPUT_VALIDATION_REPORT"

[[step]]
name = "prepare_configuration"
action = "prepare_configuration"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "parse_input"

[step.artifacts]
required_inputs = ["INPUT_TEXT_FILE"]
produces = ["RUNTIME_CONFIG"]
result_meta_key = "RUNTIME_CONFIG"

# =============================================================================
# Phase 2: Pipeline Execution
# =============================================================================

[[step]]
name = "parse_input"
action = "parse_input"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_segments"

[step.artifacts]
required_inputs = ["INPUT_TEXT_FILE", "RUNTIME_CONFIG"]
produces = ["DocumentMeta", "Section[]", "Paragraph[]", "Sentence[]"]
result_meta_key = "PARSED_CONTENT"

[[step]]
name = "validate_segments"
action = "validate_segments"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "score_importance"

[step.artifacts]
required_inputs = ["DocumentMeta", "Section[]", "Paragraph[]", "Sentence[]", "RUNTIME_CONFIG"]
produces = ["Layer_1_Validated"]
result_meta_key = "LAYER_1_VALIDATED"

[[step]]
name = "score_importance"
action = "score_importance"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "detect_redundancy"

[step.artifacts]
required_inputs = ["Layer_1_Validated", "DocumentMeta", "Sentence[]", "RUNTIME_CONFIG"]
produces = ["KeyPoint[]"]
result_meta_key = "KEY_POINTS"

[[step]]
name = "detect_redundancy"
action = "detect_redundancy"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "preserve_meaning"

[step.artifacts]
required_inputs = ["KeyPoint[]", "RUNTIME_CONFIG"]
produces = ["RedundancyCluster[]"]
result_meta_key = "REDUNDANCY_CLUSTERS"

[[step]]
name = "preserve_meaning"
action = "preserve_meaning"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "select_compression"

[step.artifacts]
required_inputs = ["KeyPoint[]", "RedundancyCluster[]", "Section[]", "RUNTIME_CONFIG"]
produces = ["KeyPoint_Deduplicated"]
result_meta_key = "KEY_POINTS_DEDUPLICATED"

[[step]]
name = "select_compression"
action = "select_compression"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "assemble_structure"

[step.artifacts]
required_inputs = ["KeyPoint_Deduplicated", "DocumentMeta", "RUNTIME_CONFIG"]
produces = ["KeyPoint_Selected"]
result_meta_key = "KEY_POINTS_SELECTED"

[[step]]
name = "assemble_structure"
action = "assemble_structure"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_language"

[step.artifacts]
required_inputs = ["KeyPoint_Selected", "RUNTIME_CONFIG"]
produces = ["SummaryBlock[]"]
result_meta_key = "SUMMARY_BLOCKS"

[[step]]
name = "validate_language"
action = "validate_language"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_length"

[step.artifacts]
required_inputs = ["SummaryBlock[]", "DocumentMeta", "RUNTIME_CONFIG"]
produces = ["ValidationRecord_CON002"]
result_meta_key = "VALIDATION_RECORD_CON002"

[[step]]
name = "validate_length"
action = "validate_length"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "render_output"

[step.artifacts]
required_inputs = ["SummaryBlock[]", "DocumentMeta", "RUNTIME_CONFIG"]
produces = ["ValidationRecord_CON001"]
result_meta_key = "VALIDATION_RECORD_CON001"

[step.on_reject_refine]
step = "select_compression"
artifact = "ValidationRecord_CON001"
max_iterations = 3
exhausted_failure_code = "COMPRESSION_RECOVERY_EXHAUSTED"
exhausted_failure_class = "PIPELINE_FAILURE"

[[step]]
name = "render_output"
action = "render_output"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_summary"

[step.artifacts]
required_inputs = ["SummaryBlock[]", "DocumentMeta", "ValidationRecord_CON001", "ValidationRecord_CON002", "RUNTIME_CONFIG"]
produces = ["SummaryDocument", "SUMMARY_FILE"]
result_meta_key = "SUMMARY_FILE"

# =============================================================================
# Phase 3: Output Validation
# =============================================================================

[[step]]
name = "validate_summary"
action = "validate_summary"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_quality"

[step.artifacts]
required_inputs = ["SUMMARY_FILE", "DocumentMeta", "SummaryDocument"]
produces = ["OUTPUT_VALIDATION_REPORT"]
result_meta_key = "OUTPUT_VALIDATION_REPORT"

[[step]]
name = "review_quality"
prompt = "prompts/01_review_quality.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "promote_summary"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["SUMMARY_FILE", "OUTPUT_VALIDATION_REPORT", "DocumentMeta", "SummaryDocument"]
produces = ["QUALITY_REVIEW_REPORT"]
result_meta_key = "QUALITY_REVIEW_REPORT"

[step.on_reject_refine]
step = "adjust_parameters"
artifact = "QUALITY_REVIEW_REPORT"
max_iterations = 2
exhausted_failure_code = "QUALITY_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# =============================================================================
# Phase 4: Delivery
# =============================================================================

[[step]]
name = "promote_summary"
action = "promote_summary"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "complete_pipeline"

[step.artifacts]
required_inputs = ["SUMMARY_FILE"]
produces = ["SUMMARY_FILE_PROMOTED"]
result_meta_key = "SUMMARY_FILE_PROMOTED"

[[step]]
name = "complete_pipeline"
action = "complete_pipeline"
enable_notifications = true
requires_human_approval_after = false

[step.artifacts]
required_inputs = ["SUMMARY_FILE_PROMOTED"]
result_meta_key = "COMPLETION_RESULT"

# =============================================================================
# Auxiliary: Quality Review Refinement (activated only on reject)
# =============================================================================

[[step]]
name = "adjust_parameters"
prompt = "prompts/02_adjust_parameters.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "parse_input"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["QUALITY_REVIEW_REPORT", "RUNTIME_CONFIG"]
produces = ["ADJUSTED_CONFIG"]
result_meta_key = "ADJUSTED_CONFIG"
