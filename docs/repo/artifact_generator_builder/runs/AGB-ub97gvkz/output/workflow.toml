# Codebase Intelligence Generator
# Transforms a codebase (documentation + Python source) into multiple
# intelligence reports: audience-specific meta content, structural health
# analysis, and security audit findings.
#
# Pattern: Input Transformation (Pattern 2)
# Layers: 3 (Input Parsing -> Analysis -> Output Rendering)
# Stages: 7 (TS-001 through TS-007)

[workflow]
name = "codebase_intelligence"
version = "1.0.0"
label = "Codebase Intelligence Generator"
job_prefix = "CBI"
description = "Scans a codebase of Rich Markdown documentation and Python source code, performs structural health analysis across 5 dimensions, security audit across 5 phases, and produces audience-tailored intelligence reports. Follows Pattern 2 (Input Transformation) with 7-stage pipeline and 24 invariants."
visibility = "canonical"
default_max_rejects = 3
init_step = "validate_input"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# =============================================================================
# Phase 1: Input Preparation
# =============================================================================

[[step]]
name = "validate_input"
action = "ci_validate_input"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "prepare_configuration"

[step.artifacts]
required_inputs = ["SOURCE_CODEBASE_DIR", "AUDIENCES_DIR", "CONFIG_FILE"]
produces = ["INPUT_VALIDATION_REPORT"]
result_meta_key = "INPUT_VALIDATION_REPORT"

[[step]]
name = "prepare_configuration"
action = "ci_prepare_configuration"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "scan_codebase"

[step.artifacts]
required_inputs = ["CONFIG_FILE"]
produces = ["RUNTIME_CONFIG"]
result_meta_key = "RUNTIME_CONFIG"

# =============================================================================
# Phase 2: Input Parsing (Layer 1)
# =============================================================================

[[step]]
name = "scan_codebase"
action = "ci_scan_codebase"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_scan"

[step.artifacts]
required_inputs = ["SOURCE_CODEBASE_DIR", "RUNTIME_CONFIG"]
produces = ["FILE_INVENTORY", "PARSE_ERRORS_LOG"]
result_meta_key = "FILE_INVENTORY"

[[step]]
name = "validate_scan"
action = "ci_validate_scan"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "build_import_graph"

[step.artifacts]
required_inputs = ["FILE_INVENTORY"]
produces = ["SCAN_INVARIANT_REPORT"]
result_meta_key = "SCAN_INVARIANT_REPORT"

[[step]]
name = "build_import_graph"
action = "ci_build_import_graph"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_import_graph"

[step.artifacts]
required_inputs = ["FILE_INVENTORY", "RUNTIME_CONFIG"]
produces = ["IMPORT_GRAPH", "SOURCE_SYMBOLS"]
result_meta_key = "IMPORT_GRAPH"

[[step]]
name = "validate_import_graph"
action = "ci_validate_import_graph"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_audiences"

[step.artifacts]
required_inputs = ["IMPORT_GRAPH", "SOURCE_SYMBOLS", "FILE_INVENTORY"]
produces = ["IMPORT_INVARIANT_REPORT"]
result_meta_key = "IMPORT_INVARIANT_REPORT"

# =============================================================================
# Phase 3: Analysis (Layer 2)
# =============================================================================

[[step]]
name = "analyze_audiences"
action = "ci_analyze_audiences"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_audiences"

[step.artifacts]
required_inputs = ["FILE_INVENTORY", "SOURCE_SYMBOLS", "AUDIENCES_DIR", "RUNTIME_CONFIG"]
produces = ["AUDIENCE_OUTPUT_DOCS", "AUDIENCE_INVARIANT_REPORT"]
result_meta_key = "AUDIENCE_OUTPUT_DOCS"

[[step]]
name = "validate_audiences"
action = "ci_validate_audiences"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_health_dimensions"

[step.artifacts]
required_inputs = ["AUDIENCE_OUTPUT_DOCS"]
produces = ["AUDIENCE_VALIDATION_REPORT"]
result_meta_key = "AUDIENCE_VALIDATION_REPORT"

[[step]]
name = "analyze_health_dimensions"
action = "ci_analyze_health_dimensions"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_health"

[step.artifacts]
required_inputs = ["IMPORT_GRAPH", "SOURCE_SYMBOLS", "FILE_INVENTORY", "RUNTIME_CONFIG"]
produces = ["HEALTH_FINDINGS"]
result_meta_key = "HEALTH_FINDINGS"

[[step]]
name = "validate_health"
action = "ci_validate_health"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_security_phases"

[step.artifacts]
required_inputs = ["HEALTH_FINDINGS", "RUNTIME_CONFIG"]
produces = ["HEALTH_INVARIANT_REPORT"]
result_meta_key = "HEALTH_INVARIANT_REPORT"

[[step]]
name = "analyze_security_phases"
action = "ci_analyze_security_phases"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_security"

[step.artifacts]
required_inputs = ["FILE_INVENTORY", "SOURCE_SYMBOLS", "RUNTIME_CONFIG"]
produces = ["SECURITY_FINDINGS"]
result_meta_key = "SECURITY_FINDINGS"

[[step]]
name = "validate_security"
action = "ci_validate_security"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "assemble_findings_reports"

[step.artifacts]
required_inputs = ["SECURITY_FINDINGS", "RUNTIME_CONFIG"]
produces = ["SECURITY_INVARIANT_REPORT"]
result_meta_key = "SECURITY_INVARIANT_REPORT"

# =============================================================================
# Phase 4: Findings Assembly
# =============================================================================

[[step]]
name = "assemble_findings_reports"
action = "ci_assemble_findings_reports"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_assembly"

[step.artifacts]
required_inputs = ["HEALTH_FINDINGS", "SECURITY_FINDINGS", "RUNTIME_CONFIG"]
produces = ["STRUCTURAL_HEALTH_REPORT_DRAFT", "SECURITY_AUDIT_REPORT_DRAFT"]
result_meta_key = "STRUCTURAL_HEALTH_REPORT_DRAFT"

[[step]]
name = "validate_assembly"
action = "ci_validate_assembly"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_outputs"

[step.artifacts]
required_inputs = ["STRUCTURAL_HEALTH_REPORT_DRAFT", "SECURITY_AUDIT_REPORT_DRAFT", "RUNTIME_CONFIG"]
produces = ["ASSEMBLY_INVARIANT_REPORT"]
result_meta_key = "ASSEMBLY_INVARIANT_REPORT"

# =============================================================================
# Phase 5: Validation and Review
# =============================================================================

[[step]]
name = "validate_outputs"
action = "ci_validate_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_quality"

[step.artifacts]
required_inputs = ["AUDIENCE_OUTPUT_DOCS", "STRUCTURAL_HEALTH_REPORT_DRAFT", "SECURITY_AUDIT_REPORT_DRAFT", "RUNTIME_CONFIG"]
produces = ["RUN_MANIFEST", "OUTPUT_VALIDATION_REPORT"]
result_meta_key = "RUN_MANIFEST"

[[step]]
name = "review_quality"
prompt = "prompts/review_quality.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "render_outputs"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["RUN_MANIFEST", "STRUCTURAL_HEALTH_REPORT_DRAFT", "SECURITY_AUDIT_REPORT_DRAFT", "AUDIENCE_OUTPUT_DOCS", "OUTPUT_VALIDATION_REPORT"]
produces = ["QUALITY_REVIEW_REPORT"]
result_meta_key = "QUALITY_REVIEW_REPORT"

[step.on_reject_refine]
step = "adjust_parameters"
artifact = "QUALITY_REVIEW_REPORT"
max_iterations = 2
exhausted_failure_code = "QUALITY_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "render_outputs"
action = "ci_render_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "promote_outputs"

[step.artifacts]
required_inputs = ["RUN_MANIFEST", "STRUCTURAL_HEALTH_REPORT_DRAFT", "SECURITY_AUDIT_REPORT_DRAFT", "AUDIENCE_OUTPUT_DOCS", "RUNTIME_CONFIG"]
produces = ["AUDIENCE_META_CONTENT", "STRUCTURAL_HEALTH_REPORT", "SECURITY_AUDIT_REPORT"]
result_meta_key = "AUDIENCE_META_CONTENT"

# =============================================================================
# Phase 6: Delivery
# =============================================================================

[[step]]
name = "promote_outputs"
action = "ci_promote_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "complete_pipeline"

[step.artifacts]
required_inputs = ["AUDIENCE_META_CONTENT", "STRUCTURAL_HEALTH_REPORT", "SECURITY_AUDIT_REPORT", "RUN_MANIFEST", "RUNTIME_CONFIG"]
produces = ["AUDIENCE_META_CONTENT_PROMOTED", "STRUCTURAL_HEALTH_REPORT_PROMOTED", "SECURITY_AUDIT_REPORT_PROMOTED", "RUN_MANIFEST_PROMOTED"]
result_meta_key = "AUDIENCE_META_CONTENT_PROMOTED"

[[step]]
name = "complete_pipeline"
action = "ci_complete_pipeline"
enable_notifications = true
requires_human_approval_after = false

[step.artifacts]
required_inputs = ["AUDIENCE_META_CONTENT_PROMOTED", "STRUCTURAL_HEALTH_REPORT_PROMOTED", "SECURITY_AUDIT_REPORT_PROMOTED", "RUN_MANIFEST_PROMOTED"]
produces = ["COMPLETION_RESULT"]
result_meta_key = "COMPLETION_RESULT"

# =============================================================================
# Auxiliary Step (Refinement Only)
# =============================================================================

[[step]]
name = "adjust_parameters"
prompt = "prompts/adjust_parameters.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_audiences"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["QUALITY_REVIEW_REPORT", "RUNTIME_CONFIG"]
produces = ["ADJUSTED_CONFIG"]
result_meta_key = "ADJUSTED_CONFIG"
