# Text Summarizer Workflow
# Generator: text_summarizer_ayz
# Pattern: Input Transformation (Pattern 2)
#
# Transforms a long-form text document (.txt or .md) into two output
# artifacts: a condensed summary (prose) and a key points list (ordered
# with importance scores).
#
# Pipeline: 7 stages (Stage 0 through Stage 6)
# Phases: 4 (Input Preparation, Pipeline Execution, Output Validation, Delivery)
# Steps: 18 primary + 1 auxiliary (adjust_parameters, refinement only)

[workflow]
name = "text_summarizer_ayz"
version = "1.0.0"
label = "Text Summarizer"
job_prefix = "TS"
description = "Transforms a long-form text document into a condensed summary and an ordered key points list. Follows Pattern 2 (Input Transformation) with a 7-stage pipeline."
visibility = "generated"
default_max_rejects = 3
init_step = "validate_input"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# =============================================================================
# Phase 1: Input Preparation (Steps 1-2)
# =============================================================================

[[step]]
name = "validate_input"
action = "validate_input"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "load_configuration"

[step.artifacts]
required_inputs = ["SOURCE_TEXT"]
produces = ["VALIDATION_INPUT_REPORT"]
result_meta_key = "VALIDATION_INPUT_REPORT"

[[step]]
name = "load_configuration"
action = "load_configuration"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "parse_input"

[step.artifacts]
required_inputs = ["RUNTIME_CONFIG"]
produces = ["CONFIG_STATE"]
result_meta_key = "CONFIG_STATE"

# =============================================================================
# Phase 2: Pipeline Execution (Steps 3-14)
# =============================================================================

[[step]]
name = "parse_input"
action = "parse_input"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "score_importance"

[step.artifacts]
required_inputs = ["SOURCE_TEXT", "CONFIG_STATE"]
produces = ["PARSED_DOCUMENT"]
result_meta_key = "PARSED_DOCUMENT"

[[step]]
name = "score_importance"
action = "score_importance"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_importance"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT", "CONFIG_STATE"]
produces = ["IMPORTANCE_ANALYSIS"]
result_meta_key = "IMPORTANCE_ANALYSIS"

[[step]]
name = "validate_importance"
action = "validate_importance"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "detect_redundancy"

[step.artifacts]
required_inputs = ["IMPORTANCE_ANALYSIS", "PARSED_DOCUMENT"]
produces = ["INV_REPORT_S1"]
result_meta_key = "INV_REPORT_S1"

[[step]]
name = "detect_redundancy"
action = "detect_redundancy"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_redundancy"

[step.artifacts]
required_inputs = ["IMPORTANCE_ANALYSIS", "PARSED_DOCUMENT", "CONFIG_STATE"]
produces = ["REDUNDANCY_CLUSTERS"]
result_meta_key = "REDUNDANCY_CLUSTERS"

[[step]]
name = "validate_redundancy"
action = "validate_redundancy"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "extract_keypoints"

[step.artifacts]
required_inputs = ["REDUNDANCY_CLUSTERS", "IMPORTANCE_ANALYSIS", "PARSED_DOCUMENT"]
produces = ["INV_REPORT_S2"]
result_meta_key = "INV_REPORT_S2"

[[step]]
name = "extract_keypoints"
action = "extract_keypoints"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_keypoints"

[step.artifacts]
required_inputs = ["REDUNDANCY_CLUSTERS", "IMPORTANCE_ANALYSIS", "CONFIG_STATE"]
produces = ["KEY_POINTS_RAW"]
result_meta_key = "KEY_POINTS_RAW"

[[step]]
name = "validate_keypoints"
action = "validate_keypoints"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "compose_summary_blocks"

[step.artifacts]
required_inputs = ["KEY_POINTS_RAW", "REDUNDANCY_CLUSTERS"]
produces = ["INV_REPORT_S3"]
result_meta_key = "INV_REPORT_S3"

[[step]]
name = "compose_summary_blocks"
action = "compose_summary_blocks"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_summary_blocks"

[step.artifacts]
required_inputs = ["PARSED_DOCUMENT", "IMPORTANCE_ANALYSIS", "REDUNDANCY_CLUSTERS", "CONFIG_STATE"]
produces = ["SUMMARY_BLOCKS"]
result_meta_key = "SUMMARY_BLOCKS"

[[step]]
name = "validate_summary_blocks"
action = "validate_summary_blocks"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "assemble_output_documents"

[step.artifacts]
required_inputs = ["SUMMARY_BLOCKS", "PARSED_DOCUMENT"]
produces = ["INV_REPORT_S4"]
result_meta_key = "INV_REPORT_S4"

[[step]]
name = "assemble_output_documents"
action = "assemble_output_documents"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_assembly"

[step.artifacts]
required_inputs = ["SUMMARY_BLOCKS", "KEY_POINTS_RAW", "PARSED_DOCUMENT", "CONFIG_STATE"]
produces = ["OUTPUT_DOCUMENTS"]
result_meta_key = "OUTPUT_DOCUMENTS"

[[step]]
name = "validate_assembly"
action = "validate_assembly"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "render_outputs"

[step.artifacts]
required_inputs = ["OUTPUT_DOCUMENTS", "PARSED_DOCUMENT"]
produces = ["INV_REPORT_S5"]
result_meta_key = "INV_REPORT_S5"

[[step]]
name = "render_outputs"
action = "render_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_outputs"

[step.artifacts]
required_inputs = ["OUTPUT_DOCUMENTS", "CONFIG_STATE"]
produces = ["CONDENSED_SUMMARY", "KEY_POINTS_LIST"]
result_meta_key = "CONDENSED_SUMMARY"

# =============================================================================
# Phase 3: Output Validation and Review (Steps 15-16)
# =============================================================================

[[step]]
name = "validate_outputs"
action = "validate_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_quality"

[step.artifacts]
required_inputs = ["CONDENSED_SUMMARY", "KEY_POINTS_LIST", "PARSED_DOCUMENT", "CONFIG_STATE"]
produces = ["VALIDATION_REPORT"]
result_meta_key = "VALIDATION_REPORT"

[step.on_reject_refine]
step = "score_importance"
artifact = "VALIDATION_REPORT"
max_iterations = 3
exhausted_failure_code = "COMPRESSION_RECOVERY_EXHAUSTED"
exhausted_failure_class = "PIPELINE_FAILURE"

[[step]]
name = "review_quality"
prompt = "prompts/review_quality.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "promote_outputs"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["VALIDATION_REPORT", "CONDENSED_SUMMARY", "KEY_POINTS_LIST"]
produces = ["QUALITY_REVIEW_REPORT"]
result_meta_key = "QUALITY_REVIEW_REPORT"

[step.on_reject_refine]
step = "adjust_parameters"
artifact = "QUALITY_REVIEW_REPORT"
max_iterations = 2
exhausted_failure_code = "QUALITY_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# =============================================================================
# Phase 4: Delivery (Steps 17-18)
# =============================================================================

[[step]]
name = "promote_outputs"
action = "promote_outputs"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "complete_pipeline"

[step.artifacts]
required_inputs = ["CONDENSED_SUMMARY", "KEY_POINTS_LIST"]
produces = ["CONDENSED_SUMMARY_PROMOTED", "KEY_POINTS_LIST_PROMOTED"]
result_meta_key = "CONDENSED_SUMMARY_PROMOTED"

[[step]]
name = "complete_pipeline"
action = "complete_pipeline"
enable_notifications = true
requires_human_approval_after = false

[step.artifacts]
required_inputs = ["CONDENSED_SUMMARY_PROMOTED", "KEY_POINTS_LIST_PROMOTED"]
produces = ["EXECUTION_LOG", "COMPLETION_RESULT"]
result_meta_key = "EXECUTION_LOG"

# =============================================================================
# Auxiliary Step: Refinement Only (Step 19)
# =============================================================================

[[step]]
name = "adjust_parameters"
prompt = "prompts/adjust_parameters.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "parse_input"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["QUALITY_REVIEW_REPORT", "CONFIG_STATE"]
produces = ["ADJUSTED_CONFIG"]
result_meta_key = "ADJUSTED_CONFIG"
