
[workflow]
name = "agnes_media_gen_v1"
version = "1.0.0"
label = "Agnes Media Generation v1"
job_prefix = "AMGEN"
description = "End-to-end media creation pipeline: image-to-description extraction, prompt variant generation, image generation, and video animation via Agnes APIs."
visibility = "canonical"
default_max_rejects = 3
init_step = "extract_descriptions"

# ============================================================================
# Step 1: Extract Descriptions (prompt-driven)
# ============================================================================
[[step]]
name = "extract_descriptions"
prompt = "prompts/01_extract_descriptions.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "generate_prompts"

[step.artifacts]
produces = ["IMAGE_DESCRIPTIONS"]
result_meta_key = "IMAGE_DESCRIPTIONS"

[step.coder]
role_policy = "architect_standard"

[step.on_reject_refine]
step = "extract_descriptions"
artifact = "IMAGE_DESCRIPTIONS"
max_iterations = 3
exhausted_failure_code = "EXTRACT_DESCRIPTIONS_REJECTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 2: Generate Prompts (prompt-driven)
# ============================================================================
[[step]]
name = "generate_prompts"
prompt = "prompts/02_generate_prompts.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "generate_images"

[step.artifacts]
required_inputs = ["IMAGE_DESCRIPTIONS"]
produces = ["PROMPT_VARIANTS"]
result_meta_key = "PROMPT_VARIANTS"

[step.coder]
role_policy = "architect_standard"

[step.on_reject_refine]
step = "generate_prompts"
artifact = "PROMPT_VARIANTS"
max_iterations = 3
exhausted_failure_code = "GENERATE_PROMPTS_REJECTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 3: Generate Images (action-driven)
# ============================================================================
[[step]]
name = "generate_images"
action = "generate_images"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "generate_videos"

[step.artifacts]
required_inputs = ["PROMPT_VARIANTS"]
produces = ["IMAGE_INDEX"]
result_meta_key = "IMAGE_INDEX"

[step.on_reject_refine]
step = "generate_images"
artifact = "IMAGE_INDEX"
max_iterations = 3
exhausted_failure_code = "GENERATE_IMAGES_REJECTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Generate Videos (action-driven)
# ============================================================================
[[step]]
name = "generate_videos"
action = "generate_videos"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["IMAGE_INDEX"]
produces = ["VIDEO_INDEX"]
result_meta_key = "VIDEO_INDEX"

[step.on_reject_refine]
step = "generate_videos"
artifact = "VIDEO_INDEX"
max_iterations = 3
exhausted_failure_code = "GENERATE_VIDEOS_REJECTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 5: Step Completion (terminal action)
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
