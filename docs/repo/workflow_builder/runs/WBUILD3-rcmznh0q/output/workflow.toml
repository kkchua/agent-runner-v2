description = "Self-bootstrapping meta-meta builder that generates meta builders with complete 3-part output. Each generated meta builder includes its own composition standard, its own spec in Specs/, and a fully executable workflow package."
visibility = "canonical"
default_max_rejects = 3
init_step = "generate_test_criteria"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

