[workflow]
name = "codebase_to_meta_v1"
version = "1.0.0"
label = "Codebase to Meta Content v1"
job_prefix = "META"
description = "Transform codebase documentation into audience-specific Rich Markdown meta content files with staged review and publish lifecycle."
visibility = "canonical"
default_max_rejects = 3
init_step = "scan_audiences"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Scan Audiences (discover audience definitions from audiences/ dir)
# ============================================================================
[[step]]
name = "scan_audiences"
action = "scan_audiences"
enable_notifications = false
onsuccess = "generate_meta"

[step.artifacts]
produces = ["AUDIENCE_INDEX"]
result_meta_key = "AUDIENCE_INDEX"

# ============================================================================
# Step 2: Generate Meta (produce audience-tailored meta content files)
# ============================================================================
[[step]]
name = "generate_meta"
prompt = "prompts/02_generate_meta.txt"
enable_notifications = true
onsuccess = "review_meta"

[step.artifacts]
required_inputs = ["CODEBASE_MANIFEST", "AUDIENCE_INDEX"]
produces = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX"]
result_meta_key = "META_INDEX"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Review Meta (human approval gate with refinement loop)
# ============================================================================
[[step]]
name = "review_meta"
prompt = "prompts/03_review_meta.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "validate_meta"

[step.artifacts]
required_inputs = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX", "AUDIENCE_INDEX"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_meta"
artifact = "META_INDEX"
max_iterations = 2
exhausted_failure_code = "REFINE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Meta (in-place corrections based on review feedback)
# ============================================================================
[[step]]
name = "refine_meta"
prompt = "prompts/04_refine_meta.txt"
enable_notifications = true
onsuccess = "review_meta"

[step.artifacts]
required_inputs = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX", "AUDIENCE_INDEX", "REVIEW_FILE_SUGGESTED"]
produces = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX"]
target_artifact = "META_DEV_FILE"
edit_mode = "in_place"
result_meta_key = "META_INDEX"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5: Validate Meta (structural validation of generated files)
# ============================================================================
[[step]]
name = "validate_meta"
action = "validate_meta"
enable_notifications = false
onsuccess = "create_meta_backup"

[step.artifacts]
required_inputs = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX", "AUDIENCE_INDEX"]
produces = ["VALIDATION_FILE"]
result_meta_key = "VALIDATION_FILE"

# ============================================================================
# Step 6: Create Meta Backup (backup current/ before publishing)
# ============================================================================
[[step]]
name = "create_meta_backup"
action = "create_meta_backup"
enable_notifications = false
onsuccess = "publish_meta"

[step.artifacts]
produces = ["META_BACKUP"]
result_meta_key = "META_BACKUP"

# ============================================================================
# Step 7: Publish Meta (copy staged content to current/, archive to history/)
# ============================================================================
[[step]]
name = "publish_meta"
action = "publish_meta"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["META_DEV_FILE", "META_ARCH_FILE", "META_EXEC_FILE", "META_INDEX", "AUDIENCE_INDEX"]
produces = ["META_MANIFEST", "META_MANIFEST_HISTORY"]
result_meta_key = "META_MANIFEST"

# ============================================================================
# Step 8: Step Completion (terminal)
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
