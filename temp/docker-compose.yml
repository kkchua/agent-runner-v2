services:
  ollama:
    image: ollama/ollama:latest
    container_name: shared-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - openclaw-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: shared-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - openclaw-net

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openclaw-net
    
  openclaw-dev:
    build:
      context: .
      dockerfile: dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        USERNAME: openclaw

    image: openclaw-sandbox-05:latest
    container_name: openclaw-sandbox
    init: true

    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/projects

    ports:
      - "8100:8100"
      - "18789:18789"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

    volumes:
      # OpenClaw app data
      - ${HOME}/openclaw-data:/home/openclaw/.openclaw

      # ukbe-runner workspace for agent execution and testing
      - ${HOME}/openclaw-ukbe-runner:/home/openclaw/.ukbe-runner

      # Project workspace
      - ${HOME}/projects-openclaw:/workspace/projects
      - ${HOME}/openclaw-models:/workspace/models
      - ./start-backend.sh:/usr/local/bin/start-backend.sh:ro

      # Persistent auth/config folders
      - ${HOME}/openclaw-auth/codex:/home/openclaw/.codex
      - ${HOME}/openclaw-auth/claude:/home/openclaw/.claude
      - ${HOME}/openclaw-auth/.claude.json:/home/openclaw/.claude.json
      - ${HOME}/openclaw-auth/qwen:/home/openclaw/.qwen
      - ${HOME}/openclaw-auth/opencode:/home/openclaw/.config/opencode

      # Optional isolated SSH copy for container
      - ${HOME}/openclaw-auth/ssh:/home/openclaw/.ssh

      # Git config can still be read-only, or copy it too
      - ${HOME}/openclaw-auth/.gitconfig:/home/openclaw/.gitconfig

    environment:
      - HOME=/home/openclaw
      - TERM=xterm-256color
      - SHELL=/bin/bash

      # Agent tools API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_API_URL=${DASHSCOPE_API_URL:-https://coding-intl.dashscope.aliyuncs.com/v1}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}

      # Claude
      #- ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      #- CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      - CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-}

      # ComfyUI
      - COMFYUI_BASE_URL=${COMFYUI_BASE_URL:-}
      - COMFYUI_EMAIL=${COMFYUI_EMAIL:-}
      - COMFYUI_PASSWORD=${COMFYUI_PASSWORD:-}

      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

      # Future optional service URLs
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - N8N_URL=${N8N_URL:-http://n8n:5678}

      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/agentrunner
      - AGENT_RUNNER_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/agentrunner
      - REDIS_URL=redis://redis:6379/0
      - AGENT_RUNNER_REDIS_URL=redis://redis:6379/0

      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - UKBE_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ukbe

    stdin_open: true
    tty: true

    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'healthy'"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped

    networks:
      - openclaw-net

networks:
  openclaw-net:
    name: openclaw-net
    driver: bridge

volumes:
  pgdata:
    external: true
    name: 00_docker_space_pgdata
  redisdata:
  ollama-data:
