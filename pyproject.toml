[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner-v2"
version = "0.8.1"
description = "Standalone workflow runner extracted from UKBE"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]
console = [
    "flet",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runner_v2*"]

[project.scripts]
ukbe-run-agent = "agent_runner_v2.run_agent:main"

[tool.setuptools.package-data]
agent_runner_v2 = [
    "*.json",
    "*.md",
    "bootstrap/bundles/core/current/*",
    "bootstrap/bundles/core/current/**/*",
    "bootstrap/workflows/default/*",
    "bootstrap/workflows/default/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests - test logic, functions, classes in isolation",
    "integration: Integration tests - test with real files, external systems, subprocesses",
]
tmp_path_retention_policy = "none"
addopts = "-p no:cacheprovider --basetemp=.pytest-temp"
