[workflow]
name = "sdlc_50_implementation_v1"
version = "1.0.0"
label = "SDLC Implementation v1"
job_prefix = "SDLC50IMP"
description = "Generate implementation plan from approved task, producing approved IMPL document."
visibility = "canonical"
default_max_rejects = 2
init_step = "generate_implementation"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Generate Implementation
# ============================================================================
[[step]]
name = "generate_implementation"
prompt = "prompts/01_generate_implementation.txt"
enable_notifications = true
onsuccess = "technical_critique"

[step.artifacts]
required_inputs = ["TASK_FILE"]
produces = ["IMPL_FILE"]
result_meta_key = "IMPL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 2: Technical Critique
# ============================================================================
[[step]]
name = "technical_critique"
prompt = "prompts/02_technical_critique.txt"
enable_notifications = true
onsuccess = "address_critique"

[step.artifacts]
required_inputs = ["IMPL_FILE"]
produces = ["CRITIQUE_FILE_SUGGESTED"]
result_meta_key = "CRITIQUE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "generate_implementation"
artifact = "IMPL_FILE"
max_iterations = 2
exhausted_failure_code = "IMPL_CRITIQUE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 2b: Address Critique
# ============================================================================
[[step]]
name = "address_critique"
prompt = "prompts/02b_address_critique.txt"
enable_notifications = true
onsuccess = "review_implementation"

[step.artifacts]
required_inputs = ["IMPL_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["IMPL_FILE"]
target_artifact = "IMPL_FILE"
edit_mode = "in_place"
result_meta_key = "IMPL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Review Implementation
# ============================================================================
[[step]]
name = "review_implementation"
prompt = "prompts/03_review_implementation.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_implementation"

[step.artifacts]
required_inputs = ["IMPL_FILE", "CRITIQUE_FILE_SUGGESTED"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_implementation"
artifact = "IMPL_FILE"
max_iterations = 2
exhausted_failure_code = "IMPL_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Implementation (conditional)
# ============================================================================
[[step]]
name = "refine_implementation"
prompt = "prompts/04_refine_implementation.txt"
enable_notifications = true

[step.artifacts]
required_inputs = ["IMPL_FILE", "REVIEW_FILE_SUGGESTED"]
produces = ["IMPL_FILE"]
target_artifact = "IMPL_FILE"
edit_mode = "in_place"
result_meta_key = "IMPL_FILE"

onsuccess = "review_implementation"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 5: Promote Implementation
# ============================================================================
[[step]]
name = "promote_implementation"
action = "promote_artifact"
promotes = "IMPL_FILE"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["IMPL_FILE"]
source = "IMPL_FILE"
dest = "IMPL_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/50_implementations"
result_meta_key = "IMPL_FILE"

# ============================================================================
# Step 6: Step Completion
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
