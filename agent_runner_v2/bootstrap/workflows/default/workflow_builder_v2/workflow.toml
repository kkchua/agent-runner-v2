[workflow]
name = "workflow_builder_v2"
version = "1.0.0"
label = "Workflow Builder v2 — Composition System Builder"
job_prefix = "WBUILD2"
description = "Builds composition system workflows using the Composition System Standard. Generates component schemas, composition formats, output formats, and operational workflows."
visibility = "canonical"
default_max_rejects = 3
init_step = "generate_test_criteria"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Phase 1: Foundation (TDD Loop)
# ============================================================================

[[step]]
name = "generate_test_criteria"
prompt = "prompts/01_generate_test_criteria.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "review_test_criteria"

[step.artifacts]
required_inputs = ["WORKFLOW_SPEC_FILE"]
produces = ["TEST_CRITERIA_FILE"]
result_meta_key = "TEST_CRITERIA_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "review_test_criteria"
prompt = "prompts/02_review_test_criteria.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_component_schema"

[step.artifacts]
produces = ["REVIEW_TEST_CRITERIA_FILE"]
result_meta_key = "REVIEW_TEST_CRITERIA_FILE"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_test_criteria"
artifact = "REVIEW_TEST_CRITERIA_FILE"
max_iterations = 2
exhausted_failure_code = "TEST_CRITERIA_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ----------------------------------------------------------------------------

[[step]]
name = "refine_test_criteria"
prompt = "prompts/03_refine_test_criteria.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_test_criteria"

[step.artifacts]
produces = ["TEST_CRITERIA_FILE"]
result_meta_key = "TEST_CRITERIA_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Phase 2: Component Schema Design
# ============================================================================

[[step]]
name = "generate_component_schema"
prompt = "prompts/04_generate_component_schema.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "gatekeep_component_schema"

[step.artifacts]
produces = ["COMPONENT_SCHEMA_FILE"]
result_meta_key = "COMPONENT_SCHEMA_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "gatekeep_component_schema"
prompt = "prompts/05_gatekeep_component_schema.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_composition_format"

[step.artifacts]
produces = ["GATEKEEP_COMPONENT_SCHEMA_FILE"]
result_meta_key = "GATEKEEP_COMPONENT_SCHEMA_FILE"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "generate_component_schema"
artifact = "GATEKEEP_COMPONENT_SCHEMA_FILE"
max_iterations = 2
exhausted_failure_code = "COMPONENT_SCHEMA_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Phase 3: Composition Format Design
# ============================================================================

[[step]]
name = "generate_composition_format"
prompt = "prompts/06_generate_composition_format.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "gatekeep_composition_format"

[step.artifacts]
produces = ["COMPOSITION_FORMAT_FILE"]
result_meta_key = "COMPOSITION_FORMAT_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "gatekeep_composition_format"
prompt = "prompts/07_gatekeep_composition_format.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_output_format"

[step.artifacts]
produces = ["GATEKEEP_COMPOSITION_FORMAT_FILE"]
result_meta_key = "GATEKEEP_COMPOSITION_FORMAT_FILE"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "generate_composition_format"
artifact = "GATEKEEP_COMPOSITION_FORMAT_FILE"
max_iterations = 2
exhausted_failure_code = "COMPOSITION_FORMAT_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Phase 4: Output Format Design
# ============================================================================

[[step]]
name = "generate_output_format"
prompt = "prompts/08_generate_output_format.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "gatekeep_output_format"

[step.artifacts]
produces = ["OUTPUT_FORMAT_FILE"]
result_meta_key = "OUTPUT_FORMAT_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "gatekeep_output_format"
prompt = "prompts/09_gatekeep_output_format.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_operational_workflow"

[step.artifacts]
produces = ["GATEKEEP_OUTPUT_FORMAT_FILE"]
result_meta_key = "GATEKEEP_OUTPUT_FORMAT_FILE"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "generate_output_format"
artifact = "GATEKEEP_OUTPUT_FORMAT_FILE"
max_iterations = 2
exhausted_failure_code = "OUTPUT_FORMAT_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Phase 5: Operational Workflow Design
# ============================================================================

[[step]]
name = "generate_operational_workflow"
prompt = "prompts/10_generate_operational_workflow.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "gatekeep_operational_workflow"

[step.artifacts]
produces = ["OPERATIONAL_WORKFLOW_FILE"]
result_meta_key = "OPERATIONAL_WORKFLOW_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "gatekeep_operational_workflow"
prompt = "prompts/11_gatekeep_operational_workflow.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_output_composition_spec"

[step.artifacts]
produces = ["GATEKEEP_OPERATIONAL_WORKFLOW_FILE"]
result_meta_key = "GATEKEEP_OPERATIONAL_WORKFLOW_FILE"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "generate_operational_workflow"
artifact = "GATEKEEP_OPERATIONAL_WORKFLOW_FILE"
max_iterations = 2
exhausted_failure_code = "OPERATIONAL_WORKFLOW_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Phase 5b: Output Composition Spec (extensibility)
# ============================================================================

[[step]]
name = "generate_output_composition_spec"
prompt = "prompts/12_generate_output_composition_spec.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_package"

[step.artifacts]
required_inputs = ["WORKFLOW_SPEC_FILE", "OPERATIONAL_WORKFLOW_FILE"]
produces = ["OUTPUT_COMPOSITION_SPEC_FILE"]
result_meta_key = "OUTPUT_COMPOSITION_SPEC_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Phase 6: Package Assembly
# ============================================================================

[[step]]
name = "generate_package"
prompt = "prompts/13_generate_package.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_package_deterministic"

[step.artifacts]
required_inputs = ["OUTPUT_COMPOSITION_SPEC_FILE"]
produces = ["WORKFLOW_MANIFEST_FILE", "WORKFLOW_EXTENSIONS_FILE", "WORKFLOW_ACTIONS_FILE", "WORKFLOW_PROMPTS_INDEX_FILE", "WORKFLOW_README_FILE"]
optional_produces = ["WORKFLOW_ENV_SAMPLE_FILE", "WORKFLOW_CONFIG_SAMPLE_FILE"]
result_meta_key = "WORKFLOW_MANIFEST_FILE"

[step.coder]
role_policy = "architect_standard"

# ----------------------------------------------------------------------------

[[step]]
name = "validate_package_deterministic"
action = "validate_package_deterministic"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "gatekeep_package"

[step.artifacts]
required_inputs = ["WORKFLOW_MANIFEST_FILE", "WORKFLOW_EXTENSIONS_FILE"]
optional_inputs = ["WORKFLOW_ACTIONS_FILE", "OUTPUT_COMPOSITION_SPEC_FILE"]
produces = ["VALIDATION_REPORT_FILE"]
result_meta_key = "VALIDATION_REPORT_FILE"

# ----------------------------------------------------------------------------

[[step]]
name = "gatekeep_package"
prompt = "prompts/14_gatekeep_package.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "review_package"

[step.artifacts]
required_inputs = ["WORKFLOW_MANIFEST_FILE", "WORKFLOW_EXTENSIONS_FILE", "VALIDATION_REPORT_FILE"]
optional_inputs = ["WORKFLOW_ACTIONS_FILE", "OUTPUT_COMPOSITION_SPEC_FILE"]
produces = ["GATEKEEP_PACKAGE_FILE"]
result_meta_key = "GATEKEEP_PACKAGE_FILE"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "generate_package"
artifact = "GATEKEEP_PACKAGE_FILE"
max_iterations = 2
exhausted_failure_code = "PACKAGE_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ----------------------------------------------------------------------------

[[step]]
name = "review_package"
prompt = "prompts/15_review_package.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "promote"

[step.artifacts]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_package"
artifact = "REVIEW_FILE_SUGGESTED"
max_iterations = 2
exhausted_failure_code = "PACKAGE_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ----------------------------------------------------------------------------

[[step]]
name = "refine_package"
prompt = "prompts/16_refine_package.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_package"

[step.artifacts]
required_inputs = ["OUTPUT_COMPOSITION_SPEC_FILE"]
produces = ["WORKFLOW_MANIFEST_FILE", "WORKFLOW_EXTENSIONS_FILE", "WORKFLOW_ACTIONS_FILE", "WORKFLOW_PROMPTS_INDEX_FILE", "WORKFLOW_README_FILE"]
optional_produces = ["WORKFLOW_ENV_SAMPLE_FILE", "WORKFLOW_CONFIG_SAMPLE_FILE"]
result_meta_key = "WORKFLOW_MANIFEST_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Phase 7: Promotion
# ============================================================================

[[step]]
name = "promote"
action = "promote_workflow_package"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "stepCompletion"

[step.artifacts]
result_meta_key = "PROMOTE_RESULT"

# ============================================================================
# Terminal Step
# ============================================================================

[[step]]
name = "stepCompletion"
action = "step_completion"
enable_notifications = true

[step.artifacts]
result_meta_key = "COMPLETION_RESULT"
