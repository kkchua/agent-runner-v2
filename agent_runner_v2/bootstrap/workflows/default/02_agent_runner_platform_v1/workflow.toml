# Agent Runner Platform v1 (BCS-compliant)
# Generates, validates, audits, and publishes the Layer 2 platform core constitution.
#
# Pipeline:
#   1. Collect     — gather platform context inventory (ACTION)
#   2. Generate    — produce 6 Layer 2 platform constitution documents
#   3. Review      — internal quality review (loop → step 4, max 2)
#   4. Refine      — address review/validation/audit findings
#   5. Validate    — deterministic validation (ACTION)
#   6. Audit       — semantic audit with human approval gate [HUMAN GATE]
#   7. Publish     — deploy to current/ (ACTION)
#   8. Complete    — terminal (ACTION)

[workflow]
name = "02_agent_runner_platform_v1"
version = "2.0.0"
label = "Agent Runner Platform v1"
job_prefix = "02AR"
description = "Generates, validates, audits, and publishes the Layer 2 platform core constitution for agent-runner-v2."
visibility = "canonical"
default_max_rejects = 3
init_step = "collect_platform_context"
layer = "layer2"
platform = "agent-runner-v2"

# ============================================================================
# Implementations (BCS)
# ============================================================================

[[workflow.implementation]]
name = "standard"
description = "Default Layer 2 platform constitution generation with review, validation, and audit."
label = "Standard"

# ============================================================================
# Step 1: Collect Platform Context (ACTION)
# ============================================================================

[[step]]
name = "collect_platform_context"
action = "collect_platform_context"
enable_notifications = true
onsuccess = "generate_platform_core_docs"

[step.artifacts]
produces = ["PLATFORM_CONTEXT_INVENTORY"]
result_meta_key = "PLATFORM_CONTEXT_INVENTORY"

# ============================================================================
# Step 2: Generate Platform Core Docs
# ============================================================================

[[step]]
name = "generate_platform_core_docs"
prompt = "{{ slot.generate_platform_core_docs }}"
enable_notifications = true
onsuccess = "review_platform_core_docs"

[step.artifacts]
required_inputs = ["PLATFORM_CONTEXT_INVENTORY"]
produces = [
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
]
result_meta_key = "L2_PLATFORM_INDEX"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 3: Review Platform Core Docs
# ============================================================================

[[step]]
name = "review_platform_core_docs"
prompt = "{{ slot.review_platform_core_docs }}"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_platform_core_docs"

[step.artifacts]
required_inputs = [
  "PLATFORM_CONTEXT_INVENTORY",
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_platform_core_docs"
artifact = "L2_PLATFORM_INDEX"
max_iterations = 2
exhausted_failure_code = "PLATFORM_CORE_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 4: Refine Platform Core Docs
# ============================================================================

[[step]]
name = "refine_platform_core_docs"
prompt = "{{ slot.refine_platform_core_docs }}"
enable_notifications = true
onsuccess = "review_platform_core_docs"

[step.artifacts]
required_inputs = [
  "PLATFORM_CONTEXT_INVENTORY",
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
  "REVIEW_FILE_SUGGESTED",
]
optional_inputs = ["PLATFORM_CORE_VALIDATION"]
produces = [
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
]
target_artifact = "L2_PLATFORM_INDEX"
edit_mode = "in_place"
result_meta_key = "L2_PLATFORM_INDEX"

[step.coder]
role_policy = "refine_standard"

# ============================================================================
# Step 5: Validate Platform Core Docs (ACTION)
# ============================================================================

[[step]]
name = "validate_platform_core_docs"
action = "validate_platform_core_docs"
enable_notifications = true
onsuccess = "audit_platform_core_docs"

[step.artifacts]
required_inputs = [
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
]
produces = ["PLATFORM_CORE_VALIDATION"]
result_meta_key = "PLATFORM_CORE_VALIDATION"

[step.on_reject_refine]
step = "refine_platform_core_docs"
artifact = "L2_PLATFORM_INDEX"
max_iterations = 2
exhausted_failure_code = "PLATFORM_CORE_VALIDATION_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 6: Audit Platform Core Docs (Human Approval Gate)
# ============================================================================

[[step]]
name = "audit_platform_core_docs"
prompt = "{{ slot.audit_platform_core_docs }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "publish_platform_core_set"

[step.artifacts]
required_inputs = [
  "PLATFORM_CONTEXT_INVENTORY",
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
  "PLATFORM_CORE_VALIDATION",
]
produces = ["AUDIT_FILE_SUGGESTED"]
result_meta_key_from_context = "AUDIT_FILE_SUGGESTED"

[step.coder]
role_policy = "validation_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_platform_core_docs"
artifact = "L2_PLATFORM_INDEX"
max_iterations = 2
exhausted_failure_code = "PLATFORM_CORE_AUDIT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 7: Publish Platform Core Set (ACTION)
# ============================================================================

[[step]]
name = "publish_platform_core_set"
action = "publish_platform_core_set"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = [
  "L2_PLATFORM_INDEX",
  "L2_RUNTIME_MODEL",
  "L2_BUNDLE_AUTHORING_CONTRACT",
  "L2_SHARED_SERVICES",
  "L2_METADATA_CONTRACT",
  "L2_VALIDATION_CONTRACT",
  "PLATFORM_CORE_VALIDATION",
  "AUDIT_FILE_SUGGESTED",
]
produces = ["PLATFORM_PUBLISH_MANIFEST", "PLATFORM_PUBLISH_MANIFEST_HISTORY"]
result_meta_key = "PLATFORM_PUBLISH_MANIFEST"

# ============================================================================
# Step 8: Step Completion (ACTION)
# ============================================================================

[[step]]
name = "stepCompletion"
action = "step_completion"
