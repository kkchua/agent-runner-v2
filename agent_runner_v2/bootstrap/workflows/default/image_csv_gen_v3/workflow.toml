[workflow]
name = "image_csv_gen_v3"
version = "1"
label = "Image CSV Generation v3"
job_prefix = "IMGCSV"
description = "Extracts image descriptions from a folder, generates CSV prompts, and submits to ComfyUI for batch processing"
default_max_rejects = 2

[workflow.init]
step = "extract_desc"
inputs = ["IMAGE_FOLDER"]

# ---------------------------------------------------------------------------
# Step 01 — extract image descriptions
# ---------------------------------------------------------------------------
[[step]]
name = "extract_desc"
prompt = "prompts/01_extract_desc.txt"
enable_notifications = true
onsuccess = "gen_prompts"

[step.artifacts]
required_inputs = ["IMAGE_FOLDER"]
produces = ["IMAGE_DESC_FOLDER"]
result_meta_key = "IMAGE_DESC_FOLDER"

[step.coder]
default_role = "developer_primary"
allowed_roles = ["architect_primary", "developer_primary", "reviewer_primary"]

# ---------------------------------------------------------------------------
# Step 02 — generate CSV prompts
# ---------------------------------------------------------------------------
[[step]]
name = "gen_prompts"
prompt = "prompts/02_gen_prompts.txt"
enable_notifications = true
onsuccess = "submit_prompts"

[step.artifacts]
required_inputs = ["IMAGE_FOLDER"]
produces = ["IMAGE_CSV_JSON", "IMAGE_CSV_CSV"]
result_meta_key = "IMAGE_CSV_JSON"

[step.coder]
default_role = "developer_secondary"
allowed_roles = ["developer_primary", "developer_secondary"]

# ---------------------------------------------------------------------------
# Step 03 — submit to ComfyUI
# ---------------------------------------------------------------------------
[[step]]
name = "submit_prompts"
action = "submit_comfyui"
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["IMAGE_CSV_JSON"]
produces = ["IMAGE_CSV_SUBMIT_RESULT"]
result_meta_key_from_context = "IMAGE_CSV_SUBMIT_RESULT_METAJSON"

# ---------------------------------------------------------------------------
# Step Completion — final terminal step
# ---------------------------------------------------------------------------
[[step]]
name = "stepCompletion"
action = "step_completion"
enable_notifications = true
