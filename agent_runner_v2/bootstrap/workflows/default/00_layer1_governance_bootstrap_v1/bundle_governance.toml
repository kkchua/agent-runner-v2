[governance]
canonical_source = "bundle_governance/core_governance.md"
generated_dir = "bundle_governance/generated"
adapter_targets = ["AGENTS.md", "QWEN.md", "CLAUDE.md"]
include_in_prompts = true
prompt_targets = ["generate_layer1_governance_docs", "review_layer1_governance_docs", "refine_layer1_governance_docs", "audit_layer1_governance_accuracy"]

[[artifact]]
key = "SYSTEM_DOCS_INDEX"
path = "docs/system/00_governance/bootstrap/README.md"
description = "Canonical Layer 1 ecosystem documentation index."
required = true

[[artifact]]
key = "SYSTEM_DOC_STANDARD"
path = "docs/system/00_governance/bootstrap/DOCUMENTATION_STANDARD.md"
description = "Canonical Layer 1 documentation contract."
required = true

[[artifact]]
key = "BUNDLE_TAXONOMY"
path = "docs/system/00_governance/bootstrap/BUNDLE_TAXONOMY.md"
description = "Canonical Layer 1 bundle taxonomy and ownership rules."
required = true

[[artifact]]
key = "RUNTIME_GOVERNANCE"
path = "docs/system/00_governance/bootstrap/RUNTIME_GOVERNANCE.md"
description = "Canonical Layer 1 runtime operating model."
required = true

[[artifact]]
key = "SYSTEM_DOCS_VALIDATION"
path = "docs/system/00_governance/bootstrap/<job_id>-layer1-governance-validation.md"
description = "Deterministic validation report for Layer 1 governance checks."
required = false

[[artifact]]
key = "REVIEW_FILE_SUGGESTED"
path = "docs/system/00_governance/bootstrap/<job_id>-layer1-governance-review.md"
description = "Reviewer or audit output used for refinement loops."
required = false
