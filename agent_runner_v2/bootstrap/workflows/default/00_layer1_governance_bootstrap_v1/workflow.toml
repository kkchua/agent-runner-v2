[workflow]
name = "00_layer1_governance_bootstrap_v1"
version = "1"
label = "Layer1 Governance Bootstrap v1"
job_prefix = "00L1"
description = "Generates and validates the reusable Layer 1 ecosystem governance master docs"
visibility = "canonical"
default_max_rejects = 2

[workflow.init]
step = "generate_layer1_governance_docs"
inputs = []

[[step]]
name = "generate_layer1_governance_docs"
prompt = "prompts/01_generate_layer1_governance_docs.txt"
enable_notifications = true
onsuccess = "review_layer1_governance_docs"

[step.artifacts]
produces = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE"
]
result_meta_key = "SYSTEM_DOCS_INDEX"

[step.coder]
role_policy = "architect_standard"

[[step]]
name = "review_layer1_governance_docs"
prompt = "prompts/02_review_layer1_governance_docs.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_layer1_governance_docs"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE"
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_layer1_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "LAYER1_GOVERNANCE_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "refine_layer1_governance_docs"
prompt = "prompts/03_refine_layer1_governance_docs.txt"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE",
  "REVIEW_FILE_SUGGESTED"
]
optional_inputs = ["SYSTEM_DOCS_VALIDATION"]
produces = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE"
]
target_artifact = "SYSTEM_DOCS_INDEX"
edit_mode = "in_place"
result_meta_key = "SYSTEM_DOCS_INDEX"
loop_returns_to = "review_layer1_governance_docs"

[step.coder]
role_policy = "architect_standard"

[[step]]
name = "validate_layer1_governance_docs"
action = "validate_layer1_governance_docs"
enable_notifications = true
onsuccess = "audit_layer1_governance_accuracy"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE"
]
produces = ["SYSTEM_DOCS_VALIDATION"]
result_meta_key = "SYSTEM_DOCS_VALIDATION"

[step.on_reject_refine]
step = "refine_layer1_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "LAYER1_GOVERNANCE_VALIDATION_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "audit_layer1_governance_accuracy"
prompt = "prompts/04_audit_layer1_governance_accuracy.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "RUNTIME_GOVERNANCE",
  "SYSTEM_DOCS_VALIDATION"
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"
must_differ = false

[step.on_reject_refine]
step = "refine_layer1_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "LAYER1_GOVERNANCE_AUDIT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "stepCompletion"
action = "step_completion"
