# SDLC Implementation, Execution, Review & Delivery v1 (BCS-compliant)
# Combined pipeline: implementation planning through execution, validation, and review.
# Uses prompt slots for swappable strategies and impl presets for configuration.
#
# Phase 1 — Implementation: TDD-driven impl plan with adversarial challenge + gate
# Phase 2 — Execution: Execute impl plan with adversarial challenge + gate
# Phase 3 — Validation: Validate execution with adversarial challenge + gate
# Phase 4 — Review: Generate review/memory/closure docs with critique + human gate

[workflow]
name = "sdlc_01_impl_exec_review_v1"
version = "2.0.0"
label = "SDLC Impl/Exec/Review v1"
job_prefix = "SDLC01IER"
description = "Combined SDLC pipeline: implementation planning through execution, validation, and review with adversarial challenge gates at each phase."
visibility = "canonical"
default_max_rejects = 2
init_step = "impl_generate"
layer = "layer3"
platform = "agent-runner-v2"

# ============================================================================
# Implementations (BCS)
# ============================================================================

[[workflow.implementation]]
name = "standard"
description = "Combined SDLC pipeline: implementation planning through execution, validation, and review with adversarial challenge gates at each phase."
label = "Standard"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Phase 1: Implementation
# ============================================================================

# ============================================================================
# Step 1.1: Generate Implementation (TDD-driven)
# ============================================================================
[[step]]
name = "impl_generate"
prompt = "{{ slot.impl_generate }}"
enable_notifications = true
onsuccess = "impl_challenge"

[step.artifacts]
required_inputs = ["TASK_FILE"]
produces = ["IMPL_FILE"]
result_meta_key = "IMPL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 1.2: Challenge Implementation (adversarial)
# ============================================================================
[[step]]
name = "impl_challenge"
prompt = "{{ slot.impl_challenge }}"
enable_notifications = true
onsuccess = "impl_address"

[step.artifacts]
required_inputs = ["IMPL_FILE", "TASK_FILE"]
produces = ["CHALLENGE_FILE_SUGGESTED"]
result_meta_key = "CHALLENGE_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "impl_generate"
artifact = "IMPL_FILE"
max_iterations = 2
exhausted_failure_code = "IMPL_CHALLENGE_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 1.2b: Address Challenges (evidence-based)
# ============================================================================
[[step]]
name = "impl_address"
prompt = "{{ slot.impl_address }}"
enable_notifications = true
onsuccess = "impl_gatekeep"

[step.artifacts]
required_inputs = ["IMPL_FILE", "CHALLENGE_FILE_SUGGESTED", "TASK_FILE"]
produces = ["IMPL_FILE"]
target_artifact = "IMPL_FILE"
edit_mode = "in_place"
result_meta_key = "IMPL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 1.3: Gatekeep Implementation (pass/fail gate)
# ============================================================================
[[step]]
name = "impl_gatekeep"
prompt = "{{ slot.impl_gatekeep }}"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_implementation"

[step.artifacts]
required_inputs = ["IMPL_FILE", "CHALLENGE_FILE_SUGGESTED", "TASK_FILE"]
produces = ["GATEKEEP_FILE_SUGGESTED"]
result_meta_key = "GATEKEEP_FILE_SUGGESTED"

[step.coder]
role_policy = "gatekeeper_standard"

[step.on_reject_refine]
step = "impl_refine"
artifact = "IMPL_FILE"
max_iterations = 2
exhausted_failure_code = "IMPL_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 1.3b: Refine Implementation (conditional)
# ============================================================================
[[step]]
name = "impl_refine"
prompt = "{{ slot.impl_refine }}"
enable_notifications = true
onsuccess = "impl_gatekeep"

[step.artifacts]
required_inputs = ["IMPL_FILE", "GATEKEEP_FILE_SUGGESTED", "TASK_FILE"]
produces = ["IMPL_FILE"]
target_artifact = "IMPL_FILE"
edit_mode = "in_place"
result_meta_key = "IMPL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 1.4: Promote Implementation (ACTION)
# ============================================================================
[[step]]
name = "promote_implementation"
action = "promote_artifact"
promotes = "IMPL_FILE"
enable_notifications = true
onsuccess = "exec_execute"

[step.artifacts]
required_inputs = ["IMPL_FILE"]
source = "IMPL_FILE"
dest = "IMPL_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/50_implementations"
result_meta_key = "IMPL_FILE"

# ============================================================================
# Phase 2: Execution
# ============================================================================

# ============================================================================
# Step 2.1: Execute Task (state-aware execution)
# ============================================================================
[[step]]
name = "exec_execute"
prompt = "{{ slot.exec_execute }}"
enable_notifications = true
onsuccess = "exec_challenge"

[step.artifacts]
required_inputs = ["IMPL_FILE"]
produces = ["EXEC_FILE"]
result_meta_key = "EXEC_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
