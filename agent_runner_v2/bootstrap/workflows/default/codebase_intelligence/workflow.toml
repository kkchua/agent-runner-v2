# Workflow: Codebase Intelligence Generator
# Auto-assembled by AGB from Analysis JSON.

[workflow]
name = "codebase_intelligence"
version = "1.0.0"
label = "Codebase Intelligence Generator"
job_prefix = "CBINT"
init_step = "scan_codebase"
description = "Generates multiple intelligence reports from codebase including audience-specific meta content, structural health analysis, and security audit findings."
default_max_rejects = 3
visibility = "canonical"
layer = "layer3"
platform = "agent-runner-v2"

[[workflow.implementation]]
name = "standard"
description = "Default implementation for Codebase Intelligence Generator"
label = "Standard"

[[step]]
name = "scan_codebase"
action = "scan_codebase"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "build_import_graph"

[step.artifacts]
produces = ["CODEBASE_INVENTORY_FILE"]
result_meta_key = "CODEBASE_INVENTORY_FILE"

[[step]]
name = "build_import_graph"
action = "build_import_graph"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "generate_audience_meta"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY_FILE"]
produces = ["IMPORT_GRAPH_FILE"]
result_meta_key = "IMPORT_GRAPH_FILE"

[[step]]
name = "generate_audience_meta"
prompt = "{{ slot.generate_audience_meta }}"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_structural_health"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY_FILE", "IMPORT_GRAPH_FILE"]
produces = ["AUDIENCE_META_CONTENT_FILE"]
result_meta_key = "AUDIENCE_META_CONTENT_FILE"

[[step]]
name = "analyze_structural_health"
prompt = "{{ slot.analyze_structural_health }}"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "analyze_security"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY_FILE", "IMPORT_GRAPH_FILE"]
produces = ["STRUCTURAL_HEALTH_FILE"]
result_meta_key = "STRUCTURAL_HEALTH_FILE"

[[step]]
name = "analyze_security"
prompt = "{{ slot.analyze_security }}"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "validate_outputs"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["CODEBASE_INVENTORY_FILE", "IMPORT_GRAPH_FILE"]
produces = ["SECURITY_AUDIT_FILE"]
result_meta_key = "SECURITY_AUDIT_FILE"

[[step]]
name = "validate_outputs"
prompt = "{{ slot.validate_outputs }}"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "step_completion"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["AUDIENCE_META_CONTENT_FILE", "STRUCTURAL_HEALTH_FILE", "SECURITY_AUDIT_FILE"]
produces = ["VALIDATION_REPORT_FILE"]
result_meta_key = "VALIDATION_REPORT_FILE"

[[step]]
name = "step_completion"
action = "step_completion"
