[governance]
canonical_source = "bundle_governance/core_governance.md"
generated_dir = "bundle_governance/generated"
adapter_targets = ["AGENTS.md"]
include_in_prompts = true
prompt_targets = [
  "review_sync_log",
  "refine_codebase_docs",
]

[[artifact]]
key = "CODEBASE_BACKUP"
path = "docs/repo/codebase/backups/BACKUP-<job_id>/"
description = "Pre-sync backup of codebase docs."
required = false

[[artifact]]
key = "CODEBASE_CHANGE_IMPACT"
path = "docs/repo/codebase/runs/<job_id>/04_changes/<job_id>-reconcile.md"
description = "Staged change impact report."
required = true

[[artifact]]
key = "CODEBASE_INVENTORY"
path = "docs/repo/codebase/runs/<job_id>/01_inventory/codebase_inventory.md"
description = "Staged codebase inventory."
required = true

[[artifact]]
key = "SYNC_LOG"
path = "docs/repo/codebase/runs/<job_id>/sync_logs/SYNC-<job_id>.md"
description = "Sync operation log."
required = false

[[artifact]]
key = "REVIEW_FILE_SUGGESTED"
path = "docs/repo/codebase/runs/<job_id>/sync_logs/<job_id>-review.md"
description = "Review output for sync log and staged docs."
required = false

[[artifact]]
key = "VALIDATION_FILE"
path = "docs/repo/codebase/runs/<job_id>/04_changes/<job_id>-reconcile-validation.md"
description = "Deterministic validation report for staged codebase docs."
required = false

[[artifact]]
key = "CODEBASE_PUBLISH_MANIFEST"
path = "docs/repo/codebase/current/codebase_manifest.json"
description = "Active publish manifest for the codebase docs."
required = false

[[artifact]]
key = "CODEBASE_PUBLISH_MANIFEST_HISTORY"
path = "docs/repo/codebase/history/<job_id>/codebase_manifest.json"
description = "Historical publish manifest snapshot for audit trail."
required = false
