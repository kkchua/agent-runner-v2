[governance]
canonical_source = "bundle_governance/core_governance.md"
generated_dir = "bundle_governance/generated"
adapter_targets = ["AGENTS.md", "QWEN.md", "CLAUDE.md"]
include_in_prompts = true
prompt_targets = [
  "generate_platform_core_docs",
  "review_platform_core_docs",
  "refine_platform_core_docs",
  "audit_platform_core_docs",
]

[[artifact]]
key = "L2_PLATFORM_INDEX"
path = "docs/system/00_governance/platform/runs/<job_id>/README.md"
description = "Staged Layer 2 platform core index."
required = true

[[artifact]]
key = "L2_RUNTIME_MODEL"
path = "docs/system/00_governance/platform/runs/<job_id>/RUNTIME_MODEL.md"
description = "Staged Layer 2 runtime model document."
required = true

[[artifact]]
key = "L2_BUNDLE_AUTHORING_CONTRACT"
path = "docs/system/00_governance/platform/runs/<job_id>/BUNDLE_AUTHORING_CONTRACT.md"
description = "Staged Layer 2 bundle authoring contract."
required = true

[[artifact]]
key = "L2_SHARED_SERVICES"
path = "docs/system/00_governance/platform/runs/<job_id>/SHARED_SERVICES.md"
description = "Staged Layer 2 shared services document."
required = true

[[artifact]]
key = "L2_METADATA_CONTRACT"
path = "docs/system/00_governance/platform/runs/<job_id>/METADATA_CONTRACT.md"
description = "Staged Layer 2 metadata contract."
required = true

[[artifact]]
key = "L2_VALIDATION_CONTRACT"
path = "docs/system/00_governance/platform/runs/<job_id>/VALIDATION_CONTRACT.md"
description = "Staged Layer 2 validation contract."
required = true

[[artifact]]
key = "PLATFORM_CONTEXT_INVENTORY"
path = "docs/system/00_governance/platform/runs/<job_id>/<job_id>-platform-context-inventory.md"
description = "Run-scoped platform context inventory."
required = false

[[artifact]]
key = "PLATFORM_CORE_VALIDATION"
path = "docs/system/00_governance/platform/runs/<job_id>/<job_id>-platform-core-validation.md"
description = "Deterministic validation report for the staged platform core set."
required = false

[[artifact]]
key = "REVIEW_FILE_SUGGESTED"
path = "docs/system/00_governance/platform/runs/<job_id>/<job_id>-platform-core-review.md"
description = "Review output used for refinement loops."
required = false

[[artifact]]
key = "AUDIT_FILE_SUGGESTED"
path = "docs/system/00_governance/platform/runs/<job_id>/<job_id>-platform-core-audit.md"
description = "Final semantic audit output."
required = false

[[artifact]]
key = "PLATFORM_PUBLISH_MANIFEST"
path = "docs/system/00_governance/platform/current/platform_set_manifest.json"
description = "Active publish manifest for the Layer 2 platform core set."
required = false

[[artifact]]
key = "PLATFORM_PUBLISH_MANIFEST_HISTORY"
path = "docs/system/00_governance/platform/history/<job_id>/platform_set_manifest.json"
description = "Historical publish manifest snapshot for audit trail."
required = false
