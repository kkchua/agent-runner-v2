[workflow]
name = "sdlc_70_validation_v1"
version = "1.0.0"
label = "SDLC Validation v1"
job_prefix = "SDLC70VAL"
description = "Generate validation report from all approved execution docs, producing approved VAL document."
visibility = "canonical"
default_max_rejects = 2
init_step = "generate_validation"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Generate Validation
# ============================================================================
[[step]]
name = "generate_validation"
prompt = "prompts/01_generate_validation.txt"
enable_notifications = true
onsuccess = "review_validation"

[step.artifacts]
required_inputs = ["EXEC_FILE"]
produces = ["VAL_FILE"]
result_meta_key = "VAL_FILE"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 2: Review Validation
# ============================================================================
[[step]]
name = "review_validation"
prompt = "prompts/02_review_validation.txt"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "promote_validation"

[step.artifacts]
required_inputs = ["VAL_FILE"]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key = "REVIEW_FILE_SUGGESTED"

[step.coder]
role_policy = "reviewer_standard"

[step.on_reject_refine]
step = "refine_validation"
artifact = "VAL_FILE"
max_iterations = 2
exhausted_failure_code = "VAL_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

# ============================================================================
# Step 3: Refine Validation (conditional)
# ============================================================================
[[step]]
name = "refine_validation"
prompt = "prompts/03_refine_validation.txt"
enable_notifications = true

[step.artifacts]
required_inputs = ["VAL_FILE", "REVIEW_FILE_SUGGESTED"]
produces = ["VAL_FILE"]
target_artifact = "VAL_FILE"
edit_mode = "in_place"
result_meta_key = "VAL_FILE"

loop_returns_to = "review_validation"

[step.coder]
role_policy = "architect_standard"

# ============================================================================
# Step 4: Promote Validation
# ============================================================================
[[step]]
name = "promote_validation"
action = "promote_artifact"
promotes = "VAL_FILE"
enable_notifications = true
onsuccess = "stepCompletion"

[step.artifacts]
required_inputs = ["VAL_FILE"]
source = "VAL_FILE"
dest = "VAL_FILE"
dest_dir = "docs/repo/agent_runner/sdlc/delivery/70_validations"
result_meta_key = "VAL_FILE"

# ============================================================================
# Step 5: Step Completion
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
