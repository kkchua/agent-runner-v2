[workflow]
name = "00_core_governance_bootstrap_v1"
version = "1"
label = "Core Governance Bootstrap v1"
job_prefix = "00CORE"
description = "Generates and validates the core governance master docs for the agent-runner ecosystem"
visibility = "canonical"
default_max_rejects = 2

[workflow.init]
step = "generate_core_governance_docs"
inputs = []

[[step]]
name = "generate_core_governance_docs"
prompt = "prompts/01_generate_core_governance_docs.txt"
enable_notifications = true
onsuccess = "review_core_governance_docs"

[step.artifacts]
produces = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN"
]
result_meta_key = "SYSTEM_DOCS_INDEX"

[step.coder]
default_role = "architect_primary"
allowed_roles = ["architect_primary", "architect_secondary", "architect_tertiary"]

[[step]]
name = "review_core_governance_docs"
prompt = "prompts/02_review_core_governance_docs.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_core_governance_docs"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN"
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
default_role = "reviewer_primary"
allowed_roles = ["reviewer_primary", "reviewer_secondary", "reviewer_tertiary"]
must_differ = false

[step.on_reject_refine]
step = "refine_core_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "CORE_GOVERNANCE_REFINEMENT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "refine_core_governance_docs"
prompt = "prompts/03_refine_core_governance_docs.txt"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN",
  "REVIEW_FILE_SUGGESTED"
]
produces = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN"
]
target_artifact = "SYSTEM_DOCS_INDEX"
edit_mode = "in_place"
result_meta_key = "SYSTEM_DOCS_INDEX"
loop_returns_to = "review_core_governance_docs"

[step.coder]
default_role = "architect_primary"
allowed_roles = ["architect_primary", "architect_secondary", "architect_tertiary"]

[[step]]
name = "validate_core_governance_docs"
action = "validate_core_governance_docs"
enable_notifications = true
onsuccess = "audit_core_governance_accuracy"

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN"
]
produces = ["SYSTEM_DOCS_VALIDATION"]
result_meta_key = "SYSTEM_DOCS_VALIDATION"

[step.on_reject_refine]
step = "refine_core_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "CORE_GOVERNANCE_VALIDATION_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "audit_core_governance_accuracy"
prompt = "prompts/04_audit_core_governance_accuracy.txt"
enable_notifications = true
onsuccess = "stepCompletion"
requires_human_approval_after = false

[step.artifacts]
required_inputs = [
  "SYSTEM_DOCS_INDEX",
  "SYSTEM_DOC_STANDARD",
  "BUNDLE_TAXONOMY",
  "BUNDLE_MIGRATION_PLAN",
  "SYSTEM_DOCS_VALIDATION"
]
produces = ["REVIEW_FILE_SUGGESTED"]
result_meta_key_from_context = "REVIEW_FILE_SUGGESTED"

[step.coder]
default_role = "reviewer_primary"
allowed_roles = ["reviewer_primary", "reviewer_secondary", "reviewer_tertiary"]
must_differ = false

[step.on_reject_refine]
step = "refine_core_governance_docs"
artifact = "SYSTEM_DOCS_INDEX"
max_iterations = 2
exhausted_failure_code = "CORE_GOVERNANCE_AUDIT_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "stepCompletion"
action = "step_completion"
