[workflow]
name = "agnes_gen_video_v1"
version = "1.0.0"
label = "Agnes Video Generation v1"
job_prefix = "AGVID"
description = "Generate videos from images using Agnes Video V2.0 API. Extracts prompts from PNG metadata and calls video generation API."
visibility = "canonical"
default_max_rejects = 3
init_step = "generate_videos"

# Layer 2 platform contract references
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# ============================================================================
# Step 1: Generate Videos (action-driven, Agnes Video V2.0 API)
# Scans step_03/ for PNG images, extracts prompts from metadata, generates videos
# ============================================================================
[[step]]
name = "generate_videos"
action = "generate_videos_from_images"
enable_notifications = true
requires_human_approval_after = true
onsuccess = "archive_step_03"

[step.artifacts]
produces = ["VIDEO_INDEX"]
result_meta_key = "VIDEO_INDEX"

# ============================================================================
# Step 2: Archive step_03 inputs (runs after generate_videos approval)
# ============================================================================
[[step]]
name = "archive_step_03"
action = "archive_inputs"
source_dir = "step_03"
archive_dir = "step_03_archive"
index_file = "step_04/index.json"
onsuccess = "stepCompletion"

[step.artifacts]
result_meta_key = "ARCHIVE_STEP_03"

# ============================================================================
# Step 3: Step Completion (terminal)
# ============================================================================
[[step]]
name = "stepCompletion"
action = "step_completion"
