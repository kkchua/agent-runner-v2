name: generator
description: "Produces variable content artifacts (reports, media, documents, summaries) as output. This is the default implementation."
label: "Content Generator"

# Generator implementation produces variable content artifacts
# using the standard AGB pipeline. No specialized steps needed.

# Implementation-specific guidance files
guidance:
  input_artifacts: "impls/generator/INPUT_ARTIFACTS.md"
  output_artifacts: "impls/generator/OUTPUT_ARTIFACTS.md"

# Prompt slot definitions — maps slot IDs to impl-specific prompt files
prompt_slots:
  analyze_requirement:
    label: "Analyze Requirement"
    default: standard
    options:
      - name: standard
        file: "prompts/analyze_requirement/generator/standard.txt"
