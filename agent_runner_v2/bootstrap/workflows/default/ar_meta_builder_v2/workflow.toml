produces = ["DOMAIN_COMPONENT_SCHEMA_FILE"]
result_meta_key = "DOMAIN_COMPONENT_SCHEMA_FILE"

[[step]]
name = "validate_component_schema"
action = "validate_design_artifact"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "gatekeep_component_schema"

[step.artifacts]
required_inputs = ["DOMAIN_COMPONENT_SCHEMA_FILE", "BOOTSTRAP_SPEC_FILE"]
