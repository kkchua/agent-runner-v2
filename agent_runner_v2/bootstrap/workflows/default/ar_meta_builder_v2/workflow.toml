# AR Meta Builder v2 -- Composition System Meta-Builder
# Transforms a runtime specification into a complete, executable workflow
# package by fine-tuning the Base Component Schema for the target domain
# and assembling the design through a 9-phase TDD-driven pipeline.
#
# Each phase follows the standardized TDD unit pattern:
#   generate -> review -> refine -> validate -> gatekeep
#
# Recursive chain: Workflow Builder v4 -> AMB v2 -> [target workflow]

[workflow]
name = "ar_meta_builder_v2"
version = "2.0.0"
label = "AR Meta Builder v2"
job_prefix = "AMB"
description = "Transforms a runtime specification into a complete, executable workflow package through a 9-phase TDD-driven pipeline with identity locking and base schema fine-tuning."
visibility = "canonical"
default_max_rejects = 3
init_step = "validate_input_spec"
layer = "layer3"
platform = "agent-runner-v2"

[workflow.governance]
include_in_prompts = true
prompt_targets = ["all"]

# =============================================================================
# Phase 0: Input Validation (pre-step)
# =============================================================================

[[step]]
name = "validate_input_spec"
action = "validate_input_spec"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_test_criteria"

[step.artifacts]
required_inputs = ["BOOTSTRAP_SPEC_FILE"]
produces = ["VALIDATION_INPUT_SPEC_FILE"]
result_meta_key = "VALIDATION_INPUT_SPEC_FILE"

# =============================================================================
# Phase 1: Analyze Spec (Domain Analysis + Meta-Test-Criteria)
# TDD Unit: generate_test_criteria -> review -> refine -> generate -> validate -> gatekeep
# =============================================================================

[[step]]
name = "generate_test_criteria"
prompt = "prompts/01_generate_test_criteria.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "review_test_criteria"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["BOOTSTRAP_SPEC_FILE"]
produces = ["TEST_CRITERIA_FILE"]
result_meta_key = "TEST_CRITERIA_FILE"

[[step]]
name = "review_test_criteria"
prompt = "prompts/02_review_test_criteria.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_domain_analysis"

[step.coder]
role_policy = "reviewer_standard"

[step.artifacts]
required_inputs = ["TEST_CRITERIA_FILE", "BOOTSTRAP_SPEC_FILE"]
produces = ["REVIEW_TEST_CRITERIA_FILE"]
result_meta_key = "REVIEW_TEST_CRITERIA_FILE"

[step.on_reject_refine]
step = "refine_test_criteria"
artifact = "REVIEW_TEST_CRITERIA_FILE"
max_iterations = 2
exhausted_failure_code = "TEST_CRITERIA_REVIEW_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

[[step]]
name = "refine_test_criteria"
prompt = "prompts/03_refine_test_criteria.txt"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "review_test_criteria"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["REVIEW_TEST_CRITERIA_FILE", "TEST_CRITERIA_FILE"]
produces = ["TEST_CRITERIA_FILE"]
result_meta_key = "TEST_CRITERIA_FILE"

[[step]]
name = "generate_domain_analysis"
prompt = "prompts/04_generate_domain_analysis.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "validate_domain_analysis"

[step.coder]
role_policy = "architect_standard"

[step.artifacts]
required_inputs = ["BOOTSTRAP_SPEC_FILE", "TEST_CRITERIA_FILE"]
produces = ["DOMAIN_ANALYSIS_FILE"]
result_meta_key = "DOMAIN_ANALYSIS_FILE"

[[step]]
name = "validate_domain_analysis"
action = "validate_design_artifact"
enable_notifications = false
requires_human_approval_after = false
onsuccess = "gatekeep_domain_analysis"

[step.artifacts]
required_inputs = ["DOMAIN_ANALYSIS_FILE", "BOOTSTRAP_SPEC_FILE"]
produces = ["VALIDATE_DOMAIN_ANALYSIS_FILE"]
result_meta_key = "VALIDATE_DOMAIN_ANALYSIS_FILE"

[step.config]
phase = "domain_analysis"
artifact_key = "DOMAIN_ANALYSIS_FILE"

[[step]]
name = "gatekeep_domain_analysis"
prompt = "prompts/05_gatekeep_domain_analysis.txt"
enable_notifications = true
requires_human_approval_after = false
onsuccess = "generate_component_schema"

[step.coder]
role_policy = "gatekeeper_standard"

[step.artifacts]
required_inputs = ["DOMAIN_ANALYSIS_FILE", "TEST_CRITERIA_FILE", "BOOTSTRAP_SPEC_FILE"]
produces = ["GATEKEEP_DOMAIN_ANALYSIS_FILE"]
result_meta_key = "GATEKEEP_DOMAIN_ANALYSIS_FILE"

[step.on_reject_refine]
step = "generate_domain_analysis"
artifact = "GATEKEEP_DOMAIN_ANALYSIS_FILE"
max_iterations = 2
exhausted_failure_code = "DOMAIN_ANALYSIS_GATEKEEP_EXHAUSTED"
exhausted_failure_class = "HUMAN_RETRY_REQUIRED"

